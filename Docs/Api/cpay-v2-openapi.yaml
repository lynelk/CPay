openapi: 3.0.3
info:
  title: CPay Gateway API
  version: 1.7.0
  description: Merchant payment, callback operations, reconciliation, finance, and operations endpoints for CPay.
security:
  - CPayV2Signature: []
paths:
  /api/v2/native/payments/collect:
    post:
      summary: Submit an adapter-native mobile money collection request
      operationId: nativeCollect
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '202':
          description: Payment accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/native/payments/payout:
    post:
      summary: Submit an adapter-native mobile money payout request
      operationId: nativePayout
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '202':
          description: Payout accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/channels:
    get:
      summary: List supported payment channels
      operationId: listChannels
      responses:
        '200':
          description: Supported channels
  /api/v2/fx/quotes:
    post:
      summary: Request a foreign-exchange quote for a cross-border transfer
      operationId: createFxQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FxQuoteRequest'
      responses:
        '201':
          description: FX quote created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxQuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/cross-border/transfers:
    post:
      summary: Create a cross-border transfer intent from an accepted FX quote
      operationId: createCrossBorderTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferIntentRequest'
      responses:
        '201':
          description: Transfer intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferIntentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/webhooks/events:
    get:
      summary: List the versioned webhook event catalog with payload schemas
      operationId: listWebhookEvents
      responses:
        '200':
          description: Webhook event catalog entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookEventCatalogEntry'
  /api/v2/payments/{reference}:
    get:
      summary: Check transaction status
      operationId: transactionStatus
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
        - name: merchantNumber
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction status
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/accounts/validate:
    post:
      summary: Validate an account name before payout
      operationId: validateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountValidationRequest'
      responses:
        '200':
          description: Account validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/payment-links:
    post:
      summary: Create a hosted checkout payment link
      operationId: createPaymentLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentLinkCreateRequest'
      responses:
        '201':
          description: Payment link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/checkout/{token}/pay:
    post:
      summary: Submit a hosted checkout payment
      operationId: payHostedCheckout
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostedCheckoutPayRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HostedCheckoutPayRequest'
      responses:
        '202':
          description: Hosted checkout accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/statements:
    get:
      summary: Export merchant statement rows
      operationId: exportMerchantStatements
      parameters:
        - name: merchantNumber
          in: query
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
      responses:
        '200':
          description: Merchant statement export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementExportResponse'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/admin/balances/sync-legacy:
    post:
      summary: Backfill normalized balances from legacy balances
      operationId: syncLegacyBalances
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Backfill result
  /api/v2/admin/callback-admin/retry-task:
    post:
      summary: Requeue one parked callback task
      operationId: retryCallbackTask
      security:
        - AdminBasicAuth: []
      parameters:
        - name: taskId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Updated count
  /api/v2/admin/provider-sandbox/run:
    post:
      summary: Record and run a provider sandbox scenario
      operationId: providerSandboxRun
      security:
        - AdminBasicAuth: []
      parameters:
        - name: channel
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sandbox run id
  /api/v2/admin/statements/check:
    post:
      summary: Validate a provider statement file before import
      operationId: validateProviderStatement
      security:
        - AdminBasicAuth: []
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Statement validation run id
  /api/v2/admin/reconciliation/reviews/request:
    post:
      summary: Request a reconciliation review (maker step)
      operationId: requestReconciliationReview
      security:
        - AdminBasicAuth: []
      parameters:
        - name: recordId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: transactionId
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: true
          schema:
            type: string
        - name: amount
          in: query
          required: true
          schema:
            type: string
        - name: currency
          in: query
          required: true
          schema:
            type: string
        - name: reason
          in: query
          required: true
          schema:
            type: string
        - name: requestedBy
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Review requested
  /api/v2/admin/reconciliation/reviews/pending:
    get:
      summary: List pending reconciliation reviews
      operationId: pendingReconciliationReviews
      security:
        - AdminBasicAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Pending reconciliation reviews
  /api/v2/admin/reconciliation/reviews/approve:
    post:
      summary: Approve a reconciliation review (checker step)
      operationId: approveReconciliationReview
      security:
        - AdminBasicAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: reviewedBy
          in: query
          required: true
          schema:
            type: string
        - name: note
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Review approved
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/reviews/reject:
    post:
      summary: Reject a reconciliation review (checker step)
      operationId: rejectReconciliationReview
      security:
        - AdminBasicAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: reviewedBy
          in: query
          required: true
          schema:
            type: string
        - name: note
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Review rejected
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/import:
    post:
      summary: Import a provider statement file (CSV or XLSX)
      operationId: importProviderStatement
      security:
        - AdminBasicAuth: []
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
        - name: importedBy
          in: query
          required: false
          schema:
            type: string
            default: system
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import run id
  /api/v2/admin/reconciliation/auto-match:
    post:
      summary: Run automatic reconciliation matching
      operationId: autoMatchReconciliation
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Number of records matched
  /api/v2/admin/reconciliation/unmatched:
    get:
      summary: List unmatched reconciliation records
      operationId: unmatchedReconciliationRecords
      security:
        - AdminBasicAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Unmatched reconciliation records
  /api/v2/admin/reconciliation/manual-match:
    post:
      summary: Manually match a reconciliation record to a transaction
      operationId: manualMatchReconciliation
      security:
        - AdminBasicAuth: []
      parameters:
        - name: recordId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: transactionId
          in: query
          required: true
          schema:
            type: string
        - name: reason
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Match recorded
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/candidate-transactions:
    get:
      summary: Search candidate CPay transactions for the manual-match workbench
      operationId: candidateTransactions
      security:
        - AdminBasicAuth: []
      parameters:
        - name: reference
          in: query
          required: false
          schema:
            type: string
        - name: amount
          in: query
          required: false
          schema:
            type: string
        - name: currency
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Candidate transactions
  /api/v2/admin/recon-finance/post:
    post:
      summary: Post approved reconciliation reviews into the ledger
      operationId: postApprovedReconciliationReviews
      security:
        - AdminBasicAuth: []
      parameters:
        - name: reviewId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: postedBy
          in: query
          required: false
          schema:
            type: string
            default: system
      responses:
        '200':
          description: Posting result
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/settlements/open:
    post:
      summary: Open a settlement batch
      operationId: openSettlementBatch
      security:
        - AdminBasicAuth: []
      parameters:
        - name: reference
          in: query
          required: true
          schema:
            type: string
        - name: provider
          in: query
          required: true
          schema:
            type: string
        - name: channel
          in: query
          required: true
          schema:
            type: string
        - name: currency
          in: query
          required: true
          schema:
            type: string
        - name: expectedAmount
          in: query
          required: true
          schema:
            type: string
        - name: openedBy
          in: query
          required: false
          schema:
            type: string
            default: system
      responses:
        '200':
          description: Batch opened
  /api/v2/admin/reconciliation/settlements/flag-record:
    post:
      summary: Flag a settlement record for follow-up
      operationId: flagSettlementRecord
      security:
        - AdminBasicAuth: []
      parameters:
        - name: recordId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: category
          in: query
          required: true
          schema:
            type: string
        - name: batchReference
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flag update result
  /api/v2/admin/recon-finance/summary:
    get:
      summary: Get reconciliation finance summary
      operationId: reconciliationFinanceSummary
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Finance summary
  /api/v2/admin/recon-finance/close:
    post:
      summary: Submit a reconciliation daily close for maker-checker approval (maker step)
      operationId: reconciliationDailyClose
      security:
        - AdminBasicAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          schema:
            type: string
            default: UGX
        - name: submittedBy
          in: query
          required: false
          schema:
            type: string
            default: system
      responses:
        '200':
          description: Daily close row id in PENDING_APPROVAL
  /api/v2/admin/recon-finance/close/approve:
    post:
      summary: Checker approval for a submitted daily close
      operationId: approveReconciliationDailyClose
      security:
        - AdminBasicAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          schema:
            type: string
            default: UGX
        - name: approvedBy
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Daily close approved and closed
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/recon-finance/close/reject:
    post:
      summary: Checker rejection for a submitted daily close
      operationId: rejectReconciliationDailyClose
      security:
        - AdminBasicAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          schema:
            type: string
            default: UGX
        - name: rejectedBy
          in: query
          required: true
          schema:
            type: string
        - name: reason
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Daily close marked rejected and left pending for re-submit
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/settlements/close/approve:
    post:
      summary: Checker approval for a submitted settlement batch close
      operationId: approveSettlementBatchClose
      security:
        - AdminBasicAuth: []
      parameters:
        - name: reference
          in: query
          required: true
          schema:
            type: string
        - name: approvedBy
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Settlement batch closed
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/settlements/close/reject:
    post:
      summary: Checker rejection for a submitted settlement batch close
      operationId: rejectSettlementBatchClose
      security:
        - AdminBasicAuth: []
      parameters:
        - name: reference
          in: query
          required: true
          schema:
            type: string
        - name: rejectedBy
          in: query
          required: true
          schema:
            type: string
        - name: reason
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Settlement batch marked rejected and left pending
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/webhooks/merchants/{merchantId}:
    post:
      summary: Register a merchant webhook endpoint
      operationId: registerMerchantWebhook
      security:
        - AdminBasicAuth: []
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType, endpointUrl]
              properties:
                eventType:
                  type: string
                endpointUrl:
                  type: string
                actor:
                  type: string
      responses:
        '201':
          description: Webhook endpoint registered
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      summary: List a merchant's webhook endpoints
      operationId: listMerchantWebhooks
      security:
        - AdminBasicAuth: []
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Registered webhook endpoints
  /api/v2/admin/webhooks/{endpointId}/rotate-secret:
    post:
      summary: Rotate a merchant webhook signing secret
      operationId: rotateWebhookSecret
      security:
        - AdminBasicAuth: []
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: New signing secret
        '404':
          description: Webhook endpoint not found
  /api/v2/admin/webhooks/deliveries/{deliveryId}/replay:
    post:
      summary: Replay a webhook delivery
      operationId: replayWebhookDelivery
      security:
        - AdminBasicAuth: []
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: actor
          in: query
          required: false
          schema:
            type: string
            default: system
      responses:
        '200':
          description: Replay updated count
  /api/v2/admin/regulator/daily-cash-flow:
    get:
      summary: Generate or fetch the Bank of Uganda daily cash-flow report
      operationId: regulatorDailyCashFlow
      security:
        - AdminBasicAuth: []
      parameters:
        - name: reportDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Daily cash-flow report
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/regulator/daily-cash-flow/csv:
    get:
      summary: Download the daily cash-flow report as CSV
      operationId: regulatorDailyCashFlowCsv
      security:
        - AdminBasicAuth: []
      parameters:
        - name: reportDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: CSV download
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/regulator/reports:
    get:
      summary: List stored regulator reports
      operationId: listRegulatorReports
      security:
        - AdminBasicAuth: []
      parameters:
        - name: reportType
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Stored regulator reports
  /api/v2/admin/regulator/pii-inventory:
    get:
      summary: List the PII data classes CPay holds (metadata only, never personal data)
      operationId: regulatorPiiInventory
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: PII data-class inventory
  /api/v2/admin/reporting/transaction-stats:
    get:
      summary: Pre-aggregated per-day transaction counts and amounts
      operationId: reportingTransactionStats
      security:
        - AdminBasicAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: merchantId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: gatewayId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Transaction stats rows
  /api/v2/admin/reporting/failure-reasons:
    get:
      summary: Aggregate failure reasons annotated via the error catalog
      operationId: reportingFailureReasons
      security:
        - AdminBasicAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: gatewayId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Failure-reason aggregates
  /api/v2/admin/reporting/float-dashboard:
    get:
      summary: Per float/stock account balance history, burn rate, and top-up log
      operationId: floatDashboard
      security:
        - AdminBasicAuth: []
      parameters:
        - name: windowDays
          in: query
          required: false
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: Float dashboard
  /api/v2/admin/reporting/float-dashboard/topups:
    post:
      summary: Record a float/stock top-up event
      operationId: recordFloatTopup
      security:
        - AdminBasicAuth: []
      parameters:
        - name: account
          in: query
          required: true
          schema:
            type: string
        - name: amount
          in: query
          required: true
          schema:
            type: number
        - name: recordedBy
          in: query
          required: false
          schema:
            type: string
            default: admin
        - name: note
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Top-up recorded
  /api/v2/admin/payout-approvals:
    get:
      summary: List payouts awaiting maker-checker approval
      operationId: listPendingPayoutApprovals
      security:
        - AdminBasicAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Pending payout approvals
  /api/v2/admin/payout-approvals/{queueId}/approve:
    post:
      summary: Checker approval for a queued payout; re-executes the payout through the normal path
      operationId: approveQueuedPayout
      security:
        - AdminBasicAuth: []
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: approvedBy
          in: query
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Payout approved and submitted through the existing payment executor
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/payout-approvals/{queueId}/reject:
    post:
      summary: Checker rejection for a queued payout
      operationId: rejectQueuedPayout
      security:
        - AdminBasicAuth: []
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: rejectedBy
          in: query
          required: true
          schema:
            type: string
        - name: reason
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Payout rejected
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/payout-approvals/{queueId}/cancel:
    post:
      summary: Cancel a queued payout before decision
      operationId: cancelQueuedPayout
      security:
        - AdminBasicAuth: []
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: cancelledBy
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payout cancelled
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/webhooks/merchants/{merchantId}/test-callback:
    post:
      summary: Queue a synthetic webhook event so a merchant callback URL can be verified
      operationId: testMerchantWebhookCallback
      security:
        - AdminBasicAuth: []
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: eventType
          in: query
          required: false
          schema:
            type: string
            default: payment.completed
        - name: actor
          in: query
          required: false
          schema:
            type: string
            default: system
      responses:
        '200':
          description: Test event queued for the merchant's active endpoint(s)
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/settlements/schedule:
    post:
      summary: Configure settlement sweep schedule
      operationId: scheduleSettlementSweep
      security:
        - AdminBasicAuth: []
      parameters:
        - name: merchantId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: provider
          in: query
          required: true
          schema:
            type: string
        - name: channel
          in: query
          required: true
          schema:
            type: string
        - name: currency
          in: query
          required: true
          schema:
            type: string
        - name: minimumRetainedBalance
          in: query
          required: false
          schema:
            type: string
        - name: sweepHour
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 23
      responses:
        '200':
          description: Settlement schedule saved
  /api/v2/admin/reconciliation/settlements/run-due:
    post:
      summary: Run due settlement sweeps
      operationId: runDueSettlementSweeps
      security:
        - AdminBasicAuth: []
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: hour
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Sweep results
  /api/v2/admin/provider-tokens:
    post:
      summary: Store an encrypted provider access token
      operationId: saveProviderToken
      security:
        - AdminBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, segment, token]
              properties:
                provider:
                  type: string
                segment:
                  type: string
                environment:
                  type: string
                  default: PRODUCTION
                token:
                  type: string
                  format: password
                expiresAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Provider token saved
  /api/v2/admin/mfa/totp/enroll:
    post:
      summary: Begin admin TOTP MFA enrollment
      operationId: enrollAdminTotp
      security:
        - AdminBasicAuth: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Enrollment secret and otpauth URL
  /api/v2/admin/mfa/totp/confirm:
    post:
      summary: Confirm admin TOTP MFA enrollment
      operationId: confirmAdminTotp
      security:
        - AdminBasicAuth: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MFA verification result
  /api/v2/admin/ops-dashboard/summary:
    get:
      summary: Get operations dashboard summary
      operationId: opsDashboardSummary
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Operations dashboard metrics
  /api/v2/admin/compliance/summary:
    get:
      summary: Get compliance and operational control counters
      operationId: complianceSummary
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Compliance summary
  /api/v2/admin/compliance/cases:
    get:
      summary: List open compliance cases
      operationId: listComplianceCases
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Open compliance cases
  /api/v2/admin/compliance/cases/{id}/decision:
    post:
      summary: Close a compliance case with a decision
      operationId: decideComplianceCase
      security:
        - AdminBasicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: decision
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Decision result
  /api/v2/admin/provider-certification/summary:
    get:
      summary: Get provider certification evidence coverage
      operationId: providerCertificationSummary
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Provider certification coverage
  /api/v2/admin/provider-certification/evidence:
    get:
      summary: List provider certification evidence
      operationId: listProviderCertificationEvidence
      security:
        - AdminBasicAuth: []
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            type: string
        - name: channel
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Provider certification evidence records
  /api/v2/admin/provider-certification/evidence/{id}/approve:
    post:
      summary: Approve captured provider certification evidence
      operationId: approveProviderCertificationEvidence
      security:
        - AdminBasicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Approval result
  /api/v2/admin/readiness/summary:
    get:
      summary: Get non-manual readiness evidence summary
      operationId: readinessSummary
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Readiness evidence counters
  /api/v2/admin/treasury/positions:
    get:
      summary: List active treasury positions with net-available balances
      operationId: listTreasuryPositions
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Active treasury positions (available, reserved, net-available)
  /api/v2/admin/treasury/positions/{currency}:
    get:
      summary: Get one treasury position by ISO currency code
      operationId: getTreasuryPosition
      security:
        - AdminBasicAuth: []
      parameters:
        - name: currency
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
      responses:
        '200':
          description: Treasury position for the currency
        '404':
          description: No active position for the currency
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  securitySchemes:
    CPayV2Signature:
      type: apiKey
      in: header
      name: X-CPay-Signature
    AdminBasicAuth:
      type: http
      scheme: basic
  parameters:
    IdempotencyKey:
      name: X-CPay-Idempotency-Key
      in: header
      required: false
      schema:
        type: string
  schemas:
    PaymentParty:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
    PaymentRequest:
      type: object
      required: [merchantNumber, country, currency, amount, reference, description, callbackUrl]
      properties:
        merchantNumber:
          type: string
        channel:
          type: string
        country:
          type: string
        currency:
          type: string
        amount:
          type: string
        reference:
          type: string
        description:
          type: string
        callbackUrl:
          type: string
        payer:
          $ref: '#/components/schemas/PaymentParty'
        payee:
          $ref: '#/components/schemas/PaymentParty'
    PaymentResult:
      type: object
      properties:
        reference:
          type: string
        transactionId:
          type: string
        status:
          type: string
        channel:
          type: string
        currency:
          type: string
        message:
          type: string
        providerResponse:
          type: string
    FxQuoteRequest:
      type: object
      required: [merchantNumber, sourceCurrency, targetCurrency, sourceAmount]
      properties:
        merchantNumber:
          type: string
        sourceCurrency:
          type: string
        targetCurrency:
          type: string
        sourceAmount:
          type: string
    FxQuoteResponse:
      type: object
      properties:
        quoteReference:
          type: string
        sourceCurrency:
          type: string
        targetCurrency:
          type: string
        sourceAmount:
          type: string
        targetAmount:
          type: string
        rate:
          type: string
        expiresAt:
          type: string
          format: date-time
    TransferIntentRequest:
      type: object
      required: [quoteReference, sourceCountry, targetCountry, sourceCurrency, targetCurrency, sourceAmount, beneficiaryAccount, beneficiaryName]
      properties:
        merchantNumber:
          type: string
        quoteReference:
          type: string
        sourceCountry:
          type: string
        targetCountry:
          type: string
        sourceCurrency:
          type: string
        targetCurrency:
          type: string
        sourceAmount:
          type: string
        beneficiaryAccount:
          type: string
        beneficiaryName:
          type: string
        description:
          type: string
    TransferIntentResponse:
      type: object
      properties:
        transferReference:
          type: string
        status:
          type: string
        message:
          type: string
    WebhookEventCatalogEntry:
      type: object
      properties:
        eventType:
          type: string
        version:
          type: integer
        qualifiedType:
          type: string
        description:
          type: string
        schema:
          type: object
    AccountValidationRequest:
      type: object
      required: [merchantNumber, msisdn]
      properties:
        merchantNumber:
          type: string
        msisdn:
          type: string
    AccountValidationResponse:
      type: object
      properties:
        msisdn:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        name:
          type: string
        status:
          type: string
    PaymentLinkCreateRequest:
      type: object
      required: [merchantNumber, amount, currency, description]
      properties:
        merchantNumber:
          type: string
        amount:
          type: string
        currency:
          type: string
        country:
          type: string
        reference:
          type: string
        description:
          type: string
        callbackUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
    PaymentLinkResponse:
      type: object
      properties:
        linkReference:
          type: string
        checkoutUrl:
          type: string
        status:
          type: string
        amount:
          type: string
        currency:
          type: string
        description:
          type: string
        expiresAt:
          type: string
          format: date-time
    HostedCheckoutPayRequest:
      type: object
      required: [payerAccount]
      properties:
        payerAccount:
          type: string
        channel:
          type: string
    StatementExportResponse:
      type: object
      properties:
        merchantNumber:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        count:
          type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/StatementRow'
    StatementRow:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createdOn:
          type: string
        gatewayId:
          type: string
        transactionType:
          type: string
        amount:
          type: number
        currency:
          type: string
        merchantReference:
          type: string
        transactionId:
          type: string
        transactionStatus:
          type: string
    ApiErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
  responses:
    BadRequest:
      description: Request was rejected
    Unauthorized:
      description: Request signature or credentials were rejected
