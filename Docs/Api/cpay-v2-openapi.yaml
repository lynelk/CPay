openapi: 3.0.3
info:
  title: CPay Gateway API
  version: 1.6.0
  description: Merchant payment, callback operations, reconciliation, finance, and operations endpoints for CPay.
security:
  - CPayV2Signature: []
paths:
  /api/v2/native/payments/collect:
    post:
      summary: Submit an adapter-native mobile money collection request
      operationId: nativeCollect
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '202':
          description: Payment accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/native/payments/payout:
    post:
      summary: Submit an adapter-native mobile money payout request
      operationId: nativePayout
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '202':
          description: Payout accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/channels:
    get:
      summary: List supported payment channels
      operationId: listChannels
      responses:
        '200':
          description: Supported channels
  /api/v2/payments/{reference}:
    get:
      summary: Check transaction status
      operationId: transactionStatus
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
        - name: merchantNumber
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction status
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/accounts/validate:
    post:
      summary: Validate an account name before payout
      operationId: validateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountValidationRequest'
      responses:
        '200':
          description: Account validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/payment-links:
    post:
      summary: Create a hosted checkout payment link
      operationId: createPaymentLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentLinkCreateRequest'
      responses:
        '201':
          description: Payment link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/checkout/{token}/pay:
    post:
      summary: Submit a hosted checkout payment
      operationId: payHostedCheckout
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostedCheckoutPayRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HostedCheckoutPayRequest'
      responses:
        '202':
          description: Hosted checkout accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/statements:
    get:
      summary: Export merchant statement rows
      operationId: exportMerchantStatements
      parameters:
        - name: merchantNumber
          in: query
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
      responses:
        '200':
          description: Merchant statement export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementExportResponse'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/admin/balances/sync-legacy:
    post:
      summary: Backfill normalized balances from legacy balances
      operationId: syncLegacyBalances
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Backfill result
  /api/v2/admin/callback-admin/retry-task:
    post:
      summary: Requeue one parked callback task
      operationId: retryCallbackTask
      security:
        - AdminBasicAuth: []
      parameters:
        - name: taskId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Updated count
  /api/v2/admin/provider-sandbox/run:
    post:
      summary: Record and run a provider sandbox scenario
      operationId: providerSandboxRun
      security:
        - AdminBasicAuth: []
      parameters:
        - name: channel
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sandbox run id
  /api/v2/admin/statements/check:
    post:
      summary: Validate a provider statement file before import
      operationId: validateProviderStatement
      security:
        - AdminBasicAuth: []
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Statement validation run id
  /api/v2/admin/recon-finance/summary:
    get:
      summary: Get reconciliation finance summary
      operationId: reconciliationFinanceSummary
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Finance summary
  /api/v2/admin/recon-finance/close:
    post:
      summary: Submit a reconciliation daily close for maker-checker approval (maker step)
      operationId: reconciliationDailyClose
      security:
        - AdminBasicAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          schema:
            type: string
            default: UGX
        - name: submittedBy
          in: query
          required: false
          schema:
            type: string
            default: system
      responses:
        '200':
          description: Daily close row id in PENDING_APPROVAL
  /api/v2/admin/recon-finance/close/approve:
    post:
      summary: Checker approval for a submitted daily close
      operationId: approveReconciliationDailyClose
      security:
        - AdminBasicAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          schema:
            type: string
            default: UGX
        - name: approvedBy
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Daily close approved and closed
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/recon-finance/close/reject:
    post:
      summary: Checker rejection for a submitted daily close
      operationId: rejectReconciliationDailyClose
      security:
        - AdminBasicAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          schema:
            type: string
            default: UGX
        - name: rejectedBy
          in: query
          required: true
          schema:
            type: string
        - name: reason
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Daily close marked rejected and left pending for re-submit
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/settlements/close/approve:
    post:
      summary: Checker approval for a submitted settlement batch close
      operationId: approveSettlementBatchClose
      security:
        - AdminBasicAuth: []
      parameters:
        - name: reference
          in: query
          required: true
          schema:
            type: string
        - name: approvedBy
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Settlement batch closed
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/settlements/close/reject:
    post:
      summary: Checker rejection for a submitted settlement batch close
      operationId: rejectSettlementBatchClose
      security:
        - AdminBasicAuth: []
      parameters:
        - name: reference
          in: query
          required: true
          schema:
            type: string
        - name: rejectedBy
          in: query
          required: true
          schema:
            type: string
        - name: reason
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Settlement batch marked rejected and left pending
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/payout-approvals:
    get:
      summary: List payouts awaiting maker-checker approval
      operationId: listPendingPayoutApprovals
      security:
        - AdminBasicAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Pending payout approvals
  /api/v2/admin/payout-approvals/{queueId}/approve:
    post:
      summary: Checker approval for a queued payout; re-executes the payout through the normal path
      operationId: approveQueuedPayout
      security:
        - AdminBasicAuth: []
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: approvedBy
          in: query
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Payout approved and submitted through the existing payment executor
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/payout-approvals/{queueId}/reject:
    post:
      summary: Checker rejection for a queued payout
      operationId: rejectQueuedPayout
      security:
        - AdminBasicAuth: []
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: rejectedBy
          in: query
          required: true
          schema:
            type: string
        - name: reason
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Payout rejected
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/payout-approvals/{queueId}/cancel:
    post:
      summary: Cancel a queued payout before decision
      operationId: cancelQueuedPayout
      security:
        - AdminBasicAuth: []
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: cancelledBy
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payout cancelled
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/webhooks/merchants/{merchantId}/test-callback:
    post:
      summary: Queue a synthetic webhook event so a merchant callback URL can be verified
      operationId: testMerchantWebhookCallback
      security:
        - AdminBasicAuth: []
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: eventType
          in: query
          required: false
          schema:
            type: string
            default: payment.completed
        - name: actor
          in: query
          required: false
          schema:
            type: string
            default: system
      responses:
        '200':
          description: Test event queued for the merchant's active endpoint(s)
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/settlements/schedule:
    post:
      summary: Configure settlement sweep schedule
      operationId: scheduleSettlementSweep
      security:
        - AdminBasicAuth: []
      parameters:
        - name: merchantId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: provider
          in: query
          required: true
          schema:
            type: string
        - name: channel
          in: query
          required: true
          schema:
            type: string
        - name: currency
          in: query
          required: true
          schema:
            type: string
        - name: minimumRetainedBalance
          in: query
          required: false
          schema:
            type: string
        - name: sweepHour
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 23
      responses:
        '200':
          description: Settlement schedule saved
  /api/v2/admin/reconciliation/settlements/run-due:
    post:
      summary: Run due settlement sweeps
      operationId: runDueSettlementSweeps
      security:
        - AdminBasicAuth: []
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: hour
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Sweep results
  /api/v2/admin/provider-tokens:
    post:
      summary: Store an encrypted provider access token
      operationId: saveProviderToken
      security:
        - AdminBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, segment, token]
              properties:
                provider:
                  type: string
                segment:
                  type: string
                environment:
                  type: string
                  default: PRODUCTION
                token:
                  type: string
                  format: password
                expiresAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Provider token saved
  /api/v2/admin/mfa/totp/enroll:
    post:
      summary: Begin admin TOTP MFA enrollment
      operationId: enrollAdminTotp
      security:
        - AdminBasicAuth: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Enrollment secret and otpauth URL
  /api/v2/admin/mfa/totp/confirm:
    post:
      summary: Confirm admin TOTP MFA enrollment
      operationId: confirmAdminTotp
      security:
        - AdminBasicAuth: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MFA verification result
  /api/v2/admin/ops-dashboard/summary:
    get:
      summary: Get operations dashboard summary
      operationId: opsDashboardSummary
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Operations dashboard metrics
  /api/v2/admin/compliance/summary:
    get:
      summary: Get compliance and operational control counters
      operationId: complianceSummary
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Compliance summary
  /api/v2/admin/compliance/cases:
    get:
      summary: List open compliance cases
      operationId: listComplianceCases
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Open compliance cases
  /api/v2/admin/compliance/cases/{id}/decision:
    post:
      summary: Close a compliance case with a decision
      operationId: decideComplianceCase
      security:
        - AdminBasicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: decision
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Decision result
  /api/v2/admin/provider-certification/summary:
    get:
      summary: Get provider certification evidence coverage
      operationId: providerCertificationSummary
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Provider certification coverage
  /api/v2/admin/provider-certification/evidence:
    get:
      summary: List provider certification evidence
      operationId: listProviderCertificationEvidence
      security:
        - AdminBasicAuth: []
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            type: string
        - name: channel
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Provider certification evidence records
  /api/v2/admin/provider-certification/evidence/{id}/approve:
    post:
      summary: Approve captured provider certification evidence
      operationId: approveProviderCertificationEvidence
      security:
        - AdminBasicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Approval result
  /api/v2/admin/readiness/summary:
    get:
      summary: Get non-manual readiness evidence summary
      operationId: readinessSummary
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Readiness evidence counters
  /api/v2/admin/treasury/positions:
    get:
      summary: List active treasury positions with net-available balances
      operationId: listTreasuryPositions
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Active treasury positions (available, reserved, net-available)
  /api/v2/admin/treasury/positions/{currency}:
    get:
      summary: Get one treasury position by ISO currency code
      operationId: getTreasuryPosition
      security:
        - AdminBasicAuth: []
      parameters:
        - name: currency
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
      responses:
        '200':
          description: Treasury position for the currency
        '404':
          description: No active position for the currency
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  securitySchemes:
    CPayV2Signature:
      type: apiKey
      in: header
      name: X-CPay-Signature
    AdminBasicAuth:
      type: http
      scheme: basic
  parameters:
    IdempotencyKey:
      name: X-CPay-Idempotency-Key
      in: header
      required: false
      schema:
        type: string
  schemas:
    PaymentParty:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
    PaymentRequest:
      type: object
      required: [merchantNumber, country, currency, amount, reference, description, callbackUrl]
      properties:
        merchantNumber:
          type: string
        channel:
          type: string
        country:
          type: string
        currency:
          type: string
        amount:
          type: string
        reference:
          type: string
        description:
          type: string
        callbackUrl:
          type: string
        payer:
          $ref: '#/components/schemas/PaymentParty'
        payee:
          $ref: '#/components/schemas/PaymentParty'
    PaymentResult:
      type: object
      properties:
        reference:
          type: string
        transactionId:
          type: string
        status:
          type: string
        channel:
          type: string
        currency:
          type: string
        message:
          type: string
        providerResponse:
          type: string
    AccountValidationRequest:
      type: object
      required: [merchantNumber, msisdn]
      properties:
        merchantNumber:
          type: string
        msisdn:
          type: string
    AccountValidationResponse:
      type: object
      properties:
        msisdn:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        name:
          type: string
        status:
          type: string
    PaymentLinkCreateRequest:
      type: object
      required: [merchantNumber, amount, currency, description]
      properties:
        merchantNumber:
          type: string
        amount:
          type: string
        currency:
          type: string
        country:
          type: string
        reference:
          type: string
        description:
          type: string
        callbackUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
    PaymentLinkResponse:
      type: object
      properties:
        linkReference:
          type: string
        checkoutUrl:
          type: string
        status:
          type: string
        amount:
          type: string
        currency:
          type: string
        description:
          type: string
        expiresAt:
          type: string
          format: date-time
    HostedCheckoutPayRequest:
      type: object
      required: [payerAccount]
      properties:
        payerAccount:
          type: string
        channel:
          type: string
    StatementExportResponse:
      type: object
      properties:
        merchantNumber:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        count:
          type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/StatementRow'
    StatementRow:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createdOn:
          type: string
        gatewayId:
          type: string
        transactionType:
          type: string
        amount:
          type: number
        currency:
          type: string
        merchantReference:
          type: string
        transactionId:
          type: string
        transactionStatus:
          type: string
    ApiErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
  responses:
    BadRequest:
      description: Request was rejected
    Unauthorized:
      description: Request signature or credentials were rejected
