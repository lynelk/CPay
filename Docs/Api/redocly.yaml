extends:
  - recommended

rules:
  info-license: off
  operation-description: warn
  operation-4xx-response: warn
  no-server-example.com: off
  # Existing v2 contracts include deployment-relative /api/v2 paths and are served in multiple
  # environments. Keep missing server metadata visible without inventing a production hostname.
  no-empty-servers: warn
  security-defined: error
  no-unresolved-refs: error
  # Several established public v2 routes are structurally ambiguous to OpenAPI tooling (for
  # example /invoices/{reference}/send vs /invoices/pay/{token}). Renaming those routes here
  # would break runtime compatibility. Keep this visible as debt until a versioned/aliased
  # migration can remove the ambiguity safely; all structural and controller-drift gates remain hard.
  no-ambiguous-paths: warn
  operation-operationId-unique: error
  operation-operationId: error
  operation-summary: error
  path-declaration-must-exist: error
  spec: error

ignore:
  - Docs/Api/generated/**
