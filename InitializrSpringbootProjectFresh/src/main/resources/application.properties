server.port=${HTTP_PORT:8081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_PHASE_TIMEOUT:30s}
spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cpayadmin}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.session.jdbc.enabled=true
spring.session.timeout=15m
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SPRING_SESSION

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
cpay.security.nonce-store=${CPAY_SECURITY_NONCE_STORE:jdbc}
# Comma-separated IP(s) of trusted reverse proxies/load balancers. X-Forwarded-For/X-Real-IP are
# only honored when the direct TCP peer is one of these; empty (default) means never trust them.
cpay.security.trusted-proxy-ips=${CPAY_TRUSTED_PROXY_IPS:}
cpay.api.legacy.sunset-date=${CPAY_LEGACY_API_SUNSET_DATE:2027-01-31}
cpay.api.legacy.docs-url=${CPAY_LEGACY_API_DOCS_URL:https://github.com/lynelk/CPay/blob/main/Docs/Api-v2-signing.md}
cpay.legacy-dbchanges.enabled=${CPAY_LEGACY_DBCHANGES_ENABLED:false}
cpay.cleanup.enabled=${CPAY_CLEANUP_ENABLED:true}
cpay.cleanup.api-rate-limit-retention-minutes=${CPAY_API_RATE_LIMIT_RETENTION_MINUTES:1440}
cpay.cleanup.callback-claim-retention-hours=${CPAY_CALLBACK_CLAIM_RETENTION_HOURS:24}
cpay.cleanup.password-reset-token-retention-days=${CPAY_PASSWORD_RESET_TOKEN_RETENTION_DAYS:7}
cpay.cleanup.webhook-delivery-retention-days=${CPAY_WEBHOOK_DELIVERY_RETENTION_DAYS:30}
# Absolute session lifetime cap regardless of activity (Spring Session's own expiry is
# inactivity-only). A session older than this is force-expired even if still active.
cpay.security.session-absolute-max-hours=${CPAY_SESSION_ABSOLUTE_MAX_HOURS:12}
cpay.transactions.timeout.default-minutes=${CPAY_TRANSACTION_TIMEOUT_MINUTES:30}
cpay.transactions.timeout.scan-delay-ms=${CPAY_TRANSACTION_TIMEOUT_SCAN_DELAY_MS:300000}
cpay.invoices.expiry.enabled=${CPAY_INVOICE_EXPIRY_ENABLED:true}
cpay.invoices.expiry.fixed-delay-ms=${CPAY_INVOICE_EXPIRY_SCAN_DELAY_MS:3600000}
# Nightly reporting aggregates (audit F4/N10/O3): purely additive - only inserts/updates the
# daily_transaction_stats/daily_failure_reason_stats/float_balance_snapshots tables - so enabled by
# default, matching cpay.cleanup.enabled's default-on convention.
cpay.reporting.aggregate.enabled=${CPAY_REPORTING_AGGREGATE_ENABLED:true}
cpay.reporting.aggregate.cron=${CPAY_REPORTING_AGGREGATE_CRON:0 20 1 * * *}

actuator.username=${ACTUATOR_USERNAME}
actuator.password=${ACTUATOR_PASSWORD}
admin.api.username=${ADMIN_API_USERNAME}
admin.api.password=${ADMIN_API_PASSWORD}
callback.signing.secret=${CALLBACK_SIGNING_SECRET}
merchant.channel.encryption.key=${MERCHANT_CHANNEL_ENCRYPTION_KEY}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

custom.gatewaystate=${CUSTOM_GATEWAYSTATE:SANDBOX}
custom.lockfiledirectory=${CUSTOM_LOCKFILEDIRECTORY:./tmp}
app.base.url=${APP_BASE_URL:http://localhost:8081}
