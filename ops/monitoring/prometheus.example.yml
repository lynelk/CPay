# Production template. Replace placeholders through the deployment system; do not commit secrets.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/cpay-alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: cpay-backend
    metrics_path: /actuator/prometheus
    scheme: https
    basic_auth:
      username: <ACTUATOR_USERNAME_FROM_SECRET_STORE>
      password: <ACTUATOR_PASSWORD_FROM_SECRET_STORE>
    static_configs:
      - targets:
          - <CPAY_PRODUCTION_BACKEND_HOST>
        labels:
          application: cpay
          environment: production
