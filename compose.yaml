services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cpay-local
      MYSQL_DATABASE: cpayadmin
      MYSQL_USER: cpay
      MYSQL_PASSWORD: cpay-local
    ports:
      - "3307:3306"
    volumes:
      - cpay_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucpay", "-pcpay-local"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./InitializrSpringbootProjectFresh
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      HTTP_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/cpayadmin
      DB_USERNAME: cpay
      DB_PASSWORD: cpay-local
      ACTUATOR_USERNAME: actuator
      ACTUATOR_PASSWORD: actuator-local-change-me
      ADMIN_API_USERNAME: admin
      ADMIN_API_PASSWORD: admin-local-change-me
      CALLBACK_SIGNING_SECRET: local-callback-secret-change-me
      MERCHANT_CHANNEL_ENCRYPTION_KEY: local-dev-32-byte-secret-change!
      CPAY_SECURITY_NONCE_STORE: jdbc
      CPAY_CLEANUP_ENABLED: "true"
      CPAY_API_RATE_LIMIT_RETENTION_MINUTES: "1440"
      CPAY_CALLBACK_CLAIM_RETENTION_HOURS: "24"
      CPAY_PASSWORD_RESET_TOKEN_RETENTION_DAYS: "7"
      CPAY_WEBHOOK_DELIVERY_RETENTION_DAYS: "30"
      CPAY_CALLBACK_TASK_RETENTION_DAYS: "30"
      CPAY_CALLBACK_SIGNATURE_RETENTION_DAYS: "30"
      CPAY_PROVIDER_RUN_RETENTION_DAYS: "90"
      CPAY_SESSION_ABSOLUTE_MAX_HOURS: "12"
      CPAY_LEDGER_REPAIR_LIMIT: "100"
      CPAY_LEGACY_DBCHANGES_ENABLED: "false"
      SHUTDOWN_PHASE_TIMEOUT: 30s
      CUSTOM_GATEWAYSTATE: SANDBOX
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      APP_BASE_URL: http://localhost:8081
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    ports:
      - "8081:8081"

volumes:
  cpay_mysql:
