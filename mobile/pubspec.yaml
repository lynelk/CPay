name: cito_mobile
description: Cito Business mobile application for iOS and Android.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/cito_icon.png
  adaptive_icon_background: '#0B1F3A'
  adaptive_icon_foreground: assets/cito_icon.png
  min_sdk_android: 24
  remove_alpha_ios: true

flutter_native_splash:
  color: '#F8FAFC'
  color_dark: '#0B1F3A'
  image: assets/cito_icon.png
  android_12:
    color: '#F8FAFC'
    color_dark: '#0B1F3A'
    image: assets/cito_icon.png
