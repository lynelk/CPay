name: One-time duplicate settlement OpenAPI repair

on:
  push:
    branches:
      - feature/iso-integrated-management-system

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repair duplicate settlement path
        run: python3 scripts/api_docs/remove_duplicate_finance_settlement_path.py
      - name: Validate duplicate-key-aware OpenAPI contract
        run: |
          python3 -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2 openapi-spec-validator==0.7.2
          python3 scripts/api_docs/validate_openapi.py Docs/Api/cpay-v2-openapi.yaml
      - name: Commit repaired contract
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/Api/cpay-v2-openapi.yaml
          if git diff --cached --quiet; then
            echo 'No OpenAPI repair required'
            exit 0
          fi
          git commit -m 'fix(api): remove duplicate finance settlement path'
          git push origin HEAD:feature/iso-integrated-management-system
