name: Temporary repair webhook client

on:
  push:
    branches: [ hardening/cpay-api-contract-routes ]
    paths:
      - ".github/workflows/temp-repair-webhook-client.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Restore verified file and migrate one route
        shell: bash
        run: |
          set -euo pipefail
          git show 01a966446f20d8bebcf9eaf39d34b4b5ec42076a:clientside/src/shared/api/hooks.ts > clientside/src/shared/api/hooks.ts
          python - <<'PY'
          from pathlib import Path
          p = Path('clientside/src/shared/api/hooks.ts')
          s = p.read_text(encoding='utf-8')
          old = '`/api/v2/admin/webhooks/${endpointId}/rotate-secret`'
          new = '`/api/v2/admin/webhooks/endpoints/${endpointId}/rotate-secret`'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old webhook rotation route, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff --stat -- clientside/src/shared/api/hooks.ts
          test "$(git diff --numstat -- clientside/src/shared/api/hooks.ts | awk '{print $1+$2}')" = "2"

      - name: Commit repaired client
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clientside/src/shared/api/hooks.ts
          git commit -m "fix: migrate admin webhook rotation client"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# rerun repair after connector truncation was detected
