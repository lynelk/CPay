name: Temporary Spotless Fix

on:
  push:
    branches:
      - fix/financial-correctness-cleanup-docs

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/financial-correctness-cleanup-docs
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply Spotless and commit exact repository formatting
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B spotless:apply --no-transfer-progress
      - name: Commit formatter output and remove temporary workflow
        run: |
          rm .github/workflows/temporary-spotless-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply Spotless formatting"
          git push origin HEAD:fix/financial-correctness-cleanup-docs
