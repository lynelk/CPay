name: Promote Production

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote verified sandbox to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out verified sandbox
        uses: actions/checkout@v7
        with:
          ref: sandbox
          fetch-depth: 0

      - name: Verify ancestry and fast-forward production
        run: |
          set -euo pipefail
          git fetch origin main sandbox production --prune

          sandbox_sha="$(git rev-parse origin/sandbox)"
          main_sha="$(git rev-parse origin/main)"
          production_sha="$(git rev-parse origin/production)"
          head_sha="$(git rev-parse HEAD)"

          if [ "$head_sha" != "$sandbox_sha" ]; then
            echo "Refusing promotion: checked-out commit is not the current sandbox head." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$sandbox_sha" "$main_sha"; then
            echo "Refusing promotion: sandbox contains commits not present in main." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$production_sha" "$sandbox_sha"; then
            echo "Refusing promotion: production cannot fast-forward to sandbox." >&2
            exit 1
          fi

          if [ "$production_sha" = "$sandbox_sha" ]; then
            echo "Production already matches sandbox; nothing to promote."
            exit 0
          fi

          git push origin "$sandbox_sha:refs/heads/production"
