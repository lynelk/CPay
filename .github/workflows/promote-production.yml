name: Promote Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Verified sandbox ref to promote
        required: false
        default: sandbox

permissions:
  contents: write

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote verified sandbox to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out requested verified ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Verify sandbox provenance and fast-forward production
        run: |
          set -euo pipefail
          git fetch origin main sandbox production

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Refusing promotion: requested ref is not contained in main." >&2
            exit 1
          fi

          if [ "${{ inputs.ref }}" = "sandbox" ] && [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/sandbox)" ]; then
            echo "Refusing promotion: local sandbox ref does not match origin/sandbox." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor origin/production HEAD; then
            echo "Refusing non-fast-forward production promotion." >&2
            exit 1
          fi

          git push origin HEAD:production
