name: Docker Build (PR)

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "InitializrSpringbootProjectFresh/**"
      - "Clientside/**"
      - "compose.yaml"
      - "nginx.conf"
      - ".github/workflows/docker-build-pr.yml"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  build-backend-pr:
    name: Build Backend (PR Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./InitializrSpringbootProjectFresh
          file: ./InitializrSpringbootProjectFresh/Dockerfile
          push: false
          tags: cpay-backend:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend-pr:
    name: Build Frontend (PR Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./Clientside
          file: ./Clientside/Dockerfile
          push: false
          tags: cpay-frontend:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-compose-pr:
    name: Test Docker Compose Stack (PR Check)
    runs-on: ubuntu-latest
    needs: [build-backend-pr, build-frontend-pr]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: |
          docker buildx build \
            -t cpay-backend:pr-${{ github.event.pull_request.number }} \
            -o type=docker \
            ./InitializrSpringbootProjectFresh

          docker buildx build \
            -t cpay-frontend:pr-${{ github.event.pull_request.number }} \
            -o type=docker \
            ./Clientside

      - name: Validate docker-compose configuration
        run: |
          docker compose config > /dev/null

      - name: Start services
        timeout-minutes: 5
        continue-on-error: true
        run: |
          docker compose up -d --wait

      - name: Check services health
        timeout-minutes: 2
        continue-on-error: true
        run: |
          echo "Waiting for MySQL..."
          timeout 60 bash -c 'until docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 -ucpay -pcpay-local; do sleep 2; done' || true
          
          echo "Waiting for backend..."
          timeout 60 bash -c 'until curl -f http://localhost:8081/actuator/health; do sleep 2; done' || true
          
          echo "Checking frontend..."
          timeout 30 bash -c 'until curl -f http://localhost:3000; do sleep 2; done' || true

      - name: Dump Docker logs on failure
        if: always()
        run: |
          docker compose logs

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v

  comment-pr:
    name: Comment PR with Build Status
    runs-on: ubuntu-latest
    needs: [build-backend-pr, build-frontend-pr, test-compose-pr]
    if: always()
    steps:
      - name: Post build status
        uses: actions/github-script@v7
        with:
          script: |
            const status = context.payload.pull_request ? '✅' : '❌';
            const backend = ${{ needs.build-backend-pr.result == 'success' }} ? '✅' : '❌';
            const frontend = ${{ needs.build-frontend-pr.result == 'success' }} ? '✅' : '❌';
            const compose = ${{ needs.test-compose-pr.result == 'success' }} ? '✅' : '❌';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🐳 Docker Build Status

| Component | Status |
|-----------|--------|
| Backend | ${backend} |
| Frontend | ${frontend} |
| Compose Stack | ${compose} |

Images built but not pushed (PR check only). Merge to \`main\` or \`develop\` to build and push to registry.`
            });
