name: Docker Build (PR)

on:
  pull_request:
    branches:
      - main
      - develop
      - production
    paths:
      - "InitializrSpringbootProjectFresh/**"
      - "clientside/**"
      - "compose.yaml"
      - "nginx.conf"
      - "Dockerfile.nginx"
      - ".github/workflows/docker-build-pr.yml"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  build_backend_pr:
    name: Build Backend (PR Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./InitializrSpringbootProjectFresh
          file: ./InitializrSpringbootProjectFresh/Dockerfile
          push: false
          tags: cpay-backend:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_frontend_pr:
    name: Build Frontend (PR Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./clientside
          file: ./clientside/Dockerfile
          push: false
          tags: cpay-frontend:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_nginx_pr:
    name: Build Nginx (PR Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.nginx
          push: false
          tags: cpay-nginx:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test_compose_pr:
    name: Test Docker Compose Stack (PR Check)
    runs-on: ubuntu-latest
    needs: [build_backend_pr, build_frontend_pr, build_nginx_pr]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build all images
        run: |
          docker buildx build \
            -t cpay-backend:pr-${{ github.event.pull_request.number }} \
            -o type=docker \
            ./InitializrSpringbootProjectFresh

          docker buildx build \
            -t cpay-frontend:pr-${{ github.event.pull_request.number }} \
            -o type=docker \
            ./clientside

          docker buildx build \
            -f ./Dockerfile.nginx \
            -t cpay-nginx:pr-${{ github.event.pull_request.number }} \
            -o type=docker \
            .

      - name: Validate docker-compose configuration
        run: docker compose config > /dev/null

      - name: Start services
        timeout-minutes: 5
        run: docker compose up -d --wait --wait-timeout 240

      - name: Check services health
        timeout-minutes: 2
        run: |
          echo "Checking MySQL..."
          docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 -ucpay -pcpay-local

          echo "Checking backend..."
          curl --fail --show-error --silent http://localhost:8081/status/health > /dev/null

          echo "Checking backend scheduler lock directory..."
          docker compose exec -T backend sh -c 'test -d /tmp/cpay-locks && test -w /tmp/cpay-locks'

          echo "Checking frontend readiness..."
          curl --fail --show-error --silent http://localhost:3000/readyz > /dev/null

          echo "Checking nginx edge..."
          curl --fail --show-error --silent http://localhost/health > /dev/null

          echo "Checking backend scheduler logs..."
          if docker compose logs backend 2>&1 | grep -Eq 'HANDLING_INITIAL_PROCESS IOException:.*/tmp/cpay-locks|PAYMENTS CRON IOException: No such file or directory'; then
            echo "Backend scheduler emitted a lock-directory runtime error" >&2
            exit 1
          fi

      - name: Dump Docker logs
        if: always()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v

  comment_pr:
    name: Comment PR with Build Status
    runs-on: ubuntu-latest
    needs: [build_backend_pr, build_frontend_pr, build_nginx_pr, test_compose_pr]
    if: always()
    steps:
      - name: Post build status
        uses: actions/github-script@v9
        with:
          script: |
            const backend = '${{ needs.build_backend_pr.result }}' === 'success' ? '✅' : '❌';
            const frontend = '${{ needs.build_frontend_pr.result }}' === 'success' ? '✅' : '❌';
            const nginx = '${{ needs.build_nginx_pr.result }}' === 'success' ? '✅' : '❌';
            const compose = '${{ needs.test_compose_pr.result }}' === 'success' ? '✅' : '❌';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🐳 Docker Build Status\n\n| Component | Status |\n|-----------|--------|\n| Backend | ${backend} |\n| Frontend | ${frontend} |\n| Nginx | ${nginx} |\n| Compose Stack | ${compose} |\n\nImages built but not pushed (PR check only). Merge to \`main\`, \`develop\`, or \`production\` to build and push to registry.`
            });
