name: Cito Mobile Quality Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'clientside/src/components/PublicLegalPages.tsx'
      - 'clientside/src/components/PublicLegalPages.test.tsx'
      - 'clientside/src/Routers.tsx'
      - 'clientside/public/sitemap.xml'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/mobile-release.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'clientside/src/components/PublicLegalPages.tsx'
      - 'clientside/src/components/PublicLegalPages.test.tsx'
      - 'clientside/src/Routers.tsx'
      - 'clientside/public/sitemap.xml'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cito-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'
  CITO_API_BASE_URL: 'https://cito.coresynergi.es'
  CITO_ENVIRONMENT: 'production'

jobs:
  android:
    name: Android analyze, tests and release AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Android API 36
        run: yes | sdkmanager 'platforms;android-36' >/dev/null
      - name: Generate Android and iOS runners
        run: bash mobile/tool/bootstrap_platforms.sh
      - name: Verify native identifiers
        run: |
          grep -q 'applicationId = "net.citotech.cito.business"' mobile/android/app/build.gradle.kts
          grep -q 'targetSdk = 36' mobile/android/app/build.gradle.kts
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = net.citotech.cito.business;' mobile/ios/Runner.xcodeproj/project.pbxproj
          test -s mobile/ios/Runner/PrivacyInfo.xcprivacy
      - name: Parse and normalize Dart sources
        working-directory: mobile
        run: dart format --output=none lib test
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        working-directory: mobile
        run: flutter test --coverage
      - name: Build Android App Bundle
        working-directory: mobile
        run: >-
          flutter build appbundle --release
          --dart-define=CITO_API_BASE_URL=${CITO_API_BASE_URL}
          --dart-define=CITO_ENVIRONMENT=${CITO_ENVIRONMENT}
      - name: Record Android checksum
        run: sha256sum mobile/build/app/outputs/bundle/release/app-release.aab | tee mobile/build/android-aab.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: cito-business-android-${{ github.sha }}
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/android-aab.sha256
            mobile/coverage/lcov.info
          if-no-files-found: error
          retention-days: 21

  ios:
    name: iOS analyze, tests and unsigned release build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          architecture: arm64
      - name: Confirm Xcode 26+
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 - <<'PY'
          import re, subprocess
          output = subprocess.check_output(['xcodebuild', '-version'], text=True)
          match = re.search(r'Xcode (\d+)', output)
          if not match or int(match.group(1)) < 26:
              raise SystemExit(f'Xcode 26+ is required, got: {output}')
          PY
      - name: Generate Android and iOS runners
        run: bash mobile/tool/bootstrap_platforms.sh
      - name: Parse and normalize Dart sources
        working-directory: mobile
        run: dart format --output=none lib test
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Build unsigned iOS release
        working-directory: mobile
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=CITO_API_BASE_URL=${CITO_API_BASE_URL}
          --dart-define=CITO_ENVIRONMENT=${CITO_ENVIRONMENT}
      - name: Archive unsigned build evidence
        run: |
          ditto -c -k --sequesterRsrc --keepParent mobile/build/ios/iphoneos/Runner.app mobile/build/CitoBusiness-unsigned-ios.zip
          shasum -a 256 mobile/build/CitoBusiness-unsigned-ios.zip | tee mobile/build/ios-unsigned.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: cito-business-ios-unsigned-${{ github.sha }}
          path: |
            mobile/build/CitoBusiness-unsigned-ios.zip
            mobile/build/ios-unsigned.sha256
          if-no-files-found: error
          retention-days: 21
