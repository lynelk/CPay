name: One-time CPay OpenAPI operationId backfill

on:
  push:
    branches:
      - feature/iso-integrated-management-system

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install OpenAPI validation dependencies
        run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2 openapi-spec-validator==0.7.2
      - name: Backfill approved operationIds
        run: python3 scripts/api_docs/backfill_cpay_openapi_operation_ids.py
      - name: Validate repaired CPay OpenAPI contract
        run: python3 scripts/api_docs/validate_openapi.py Docs/Api/cpay-v2-openapi.yaml
      - name: Commit operationId backfill when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- Docs/Api/cpay-v2-openapi.yaml; then
            echo 'No operationId backfill required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/Api/cpay-v2-openapi.yaml
          git commit -m 'fix(api): complete CPay OpenAPI operationIds'
          git push origin HEAD:feature/iso-integrated-management-system
