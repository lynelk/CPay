name: Cito Mobile Store Release

on:
  workflow_dispatch:
    inputs:
      publish_android:
        description: Upload the signed AAB to Google Play internal testing
        required: true
        type: boolean
        default: false
      publish_ios:
        description: Upload the signed IPA to TestFlight
        required: true
        type: boolean
        default: false
      release_name:
        description: Human-readable release label
        required: true
        default: 'Cito Business 1.0.0'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'
  CITO_API_BASE_URL: 'https://cito.coresynergi.es'
  CITO_ENVIRONMENT: 'production'

jobs:
  android-release:
    name: Signed Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: mobile-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Android API 36
        run: yes | sdkmanager 'platforms;android-36' >/dev/null
      - run: bash mobile/tool/bootstrap_platforms.sh
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > mobile/android/app/cito-release.jks
          cat > mobile/android/key.properties <<PROPERTIES
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=cito-release.jks
          PROPERTIES
      - name: Analyze and test
        working-directory: mobile
        run: |
          dart format --output=none lib test
          flutter analyze --fatal-infos --fatal-warnings
          flutter test
      - name: Build signed AAB
        working-directory: mobile
        run: >-
          flutter build appbundle --release
          --dart-define=CITO_API_BASE_URL=${CITO_API_BASE_URL}
          --dart-define=CITO_ENVIRONMENT=${CITO_ENVIRONMENT}
      - name: Verify signature and checksum
        run: |
          jarsigner -verify -verbose -certs mobile/build/app/outputs/bundle/release/app-release.aab
          sha256sum mobile/build/app/outputs/bundle/release/app-release.aab | tee mobile/build/android-release.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: cito-business-android-signed-${{ github.sha }}
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/android-release.sha256
          if-no-files-found: error
          retention-days: 60
      - name: Upload to Google Play internal testing
        if: ${{ inputs.publish_android }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.citotech.cito.business
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: ${{ inputs.release_name }}

  ios-release:
    name: Signed iOS release
    runs-on: macos-26
    timeout-minutes: 50
    environment: mobile-production
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          architecture: arm64
      - run: bash mobile/tool/bootstrap_platforms.sh
      - name: Install signing certificate and provisioning profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          : "${IOS_DISTRIBUTION_CERTIFICATE_BASE64:?certificate is required}"
          : "${IOS_CERTIFICATE_PASSWORD:?certificate password is required}"
          : "${IOS_PROVISIONING_PROFILE_BASE64:?profile is required}"
          : "${IOS_TEAM_ID:?team ID is required}"
          : "${IOS_PROVISIONING_PROFILE_NAME:?profile name is required}"

          CERTIFICATE_PATH="${RUNNER_TEMP}/cito-distribution.p12"
          PROFILE_PATH="${RUNNER_TEMP}/cito.mobileprovision"
          KEYCHAIN_PATH="${RUNNER_TEMP}/cito-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "${IOS_DISTRIBUTION_CERTIFICATE_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"
          printf '%s' "${IOS_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${PROFILE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${IOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security list-keychain -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PLIST="${RUNNER_TEMP}/profile.plist"
          security cms -D -i "${PROFILE_PATH}" > "${PROFILE_PLIST}"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "${PROFILE_PLIST}")"
          cp "${PROFILE_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          bash mobile/tool/configure_ios_signing.sh
          cat > mobile/ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key><dict>
              <key>net.citotech.cito.business</key><string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          PLIST
      - name: Analyze and test
        working-directory: mobile
        run: |
          dart format --output=none lib test
          flutter analyze --fatal-infos --fatal-warnings
          flutter test
      - name: Build signed IPA
        working-directory: mobile
        run: >-
          flutter build ipa --release
          --export-options-plist=ios/ExportOptions.plist
          --dart-define=CITO_API_BASE_URL=${CITO_API_BASE_URL}
          --dart-define=CITO_ENVIRONMENT=${CITO_ENVIRONMENT}
      - name: Checksum IPA
        run: shasum -a 256 mobile/build/ios/ipa/*.ipa | tee mobile/build/ios-release.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: cito-business-ios-signed-${{ github.sha }}
          path: |
            mobile/build/ios/ipa/*.ipa
            mobile/build/ios-release.sha256
          if-no-files-found: error
          retention-days: 60
      - name: Upload to TestFlight
        if: ${{ inputs.publish_ios }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          : "${APP_STORE_CONNECT_API_KEY_ID:?API key ID is required}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?issuer ID is required}"
          : "${APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64:?private key is required}"
          mkdir -p "${HOME}/.appstoreconnect/private_keys"
          printf '%s' "${APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64}" | base64 --decode > "${HOME}/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          IPA_PATH="$(find mobile/build/ios/ipa -name '*.ipa' -print -quit)"
          xcrun altool --upload-app --type ios --file "${IPA_PATH}" --apiKey "${APP_STORE_CONNECT_API_KEY_ID}" --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"
