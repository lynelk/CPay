# Deterministic release gate for the exact checked-out revision.
name: Cito Exact-Head Release Verification

on:
  pull_request:
    branches: [main, production]
    paths:
      - 'clientside/**'
      - '.github/workflows/cito-correct-everything-20260903.yml'
  push:
    branches: [main, production]
    paths:
      - 'clientside/**'
      - '.github/workflows/cito-correct-everything-20260903.yml'
  workflow_dispatch: {}

concurrency:
  group: cito-exact-head-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-exact-head:
    name: Audit, static checks, tests, build and browser matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clientside
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v7

      - name: Configure Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: clientside/package-lock.json

      - name: Install exact application dependencies
        run: npm ci --legacy-peer-deps

      - name: Reject high-severity dependency findings
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test
        env:
          CI: 'true'
          NODE_OPTIONS: '--openssl-legacy-provider'

      - name: Build the production frontend
        run: npm run build

      - name: Install the pinned browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run the automated responsive browser matrix
        run: npx playwright test --config=playwright.config.mjs

      - name: Verify repository hygiene
        working-directory: .
        run: git diff --check

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cito-exact-head-browser-evidence-${{ github.run_id }}
          path: |
            clientside/playwright-report/
            clientside/test-results/browser-matrix/
          retention-days: 14
          if-no-files-found: warn

  production-public-health:
    name: Read-only public production health
    # This probes the CURRENT runtime, not the proposed PR artifact. Railway
    # deployment metadata remains the authority for the running release SHA.
    if: github.ref == 'refs/heads/production' || (github.event_name == 'pull_request' && github.base_ref == 'production' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check fixed public liveness and backend-readiness endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          # GET only: no auth, cookies, customer data, provider calls or money
          # movement. TLS certificate verification uses Python's default trust.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def valid_health(status, content_type, body, liveness):
              if status != 200 or not body.strip() or len(body) > 65536:
                  return False
              if 'html' in content_type.lower() or body.lstrip().startswith(b'<'):
                  return False
              if liveness:
                  return body.strip() == b'ok'
              # Reject explicit unhealthy JSON even if accidentally served 200.
              try:
                  data = json.loads(body)
              except (ValueError, UnicodeError):
                  return body.strip().lower() in (b'ok', b'up', b'healthy')
              return isinstance(data, dict) and str(data.get('status', '')).upper() in ('UP', 'OK', 'HEALTHY')

          # Contract checks ensure an SPA fallback or an unhealthy 200 cannot
          # be recorded as readiness. These checks perform no network traffic.
          assert valid_health(200, 'text/plain', b'ok', True)
          assert valid_health(200, 'application/json', b'{"status":"UP"}', False)
          assert not valid_health(200, 'text/html', b'<html>login</html>', False)
          assert not valid_health(200, 'application/json', b'{"status":"DOWN"}', False)
          assert not valid_health(503, 'application/json', b'{"status":"UP"}', False)
          assert not valid_health(200, 'application/json', b'{}', False)
          assert not valid_health(200, 'text/plain', b'', True)
          assert not valid_health(200, 'text/plain', b'ok', False) is False

          opener = urllib.request.build_opener(NoRedirect)
          results = []
          for host in ('cito.coresynergi.es', 'cito-frontend-production.up.railway.app'):
              for path in ('/healthz', '/readyz', '/api/status/health'):
                  result = {'host': host, 'path': path, 'passed': False}
                  for attempt in range(1, 3):
                      started = time.monotonic()
                      result.update(attempt=attempt, http_status=None, error_type=None)
                      try:
                          request = urllib.request.Request(
                              'https://' + host + path, method='GET',
                              headers={'User-Agent': 'Cito-Release-Readiness/1.0', 'Accept': '*/*'})
                          with opener.open(request, timeout=10) as response:
                              result['http_status'] = response.status
                              result['passed'] = valid_health(
                                  response.status, response.headers.get('Content-Type', ''),
                                  response.read(65537), path == '/healthz')
                      except urllib.error.HTTPError as exc:
                          result.update(http_status=exc.code, error_type='HTTPError')
                      except (urllib.error.URLError, TimeoutError, OSError, ValueError) as exc:
                          result['error_type'] = type(exc).__name__
                      result['elapsed_ms'] = round((time.monotonic() - started) * 1000)
                      if result['passed']:
                          break
                      if attempt == 1:
                          time.sleep(2)
                  results.append(result)
                  print(json.dumps(result, sort_keys=True))

          report = {
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
              'workflow_sha': os.environ.get('GITHUB_SHA'),
              'scope': 'Point-in-time public HTTP health only; not authenticated UAT, provider certification, database restore, load testing or runtime SHA attestation.',
              'results': results,
              'passed': all(item['passed'] for item in results),
          }
          Path('cito-public-health.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Public production health (read-only)\n\n')
              summary.write(report['scope'] + '\n\n')
              summary.write('| Host | Path | HTTP | Passed | Attempts |\n|---|---|---|---|---|\n')
              for item in results:
                  summary.write(f"| {item['host']} | {item['path']} | {item['http_status']} | {item['passed']} | {item['attempt']} |\n")
          if not report['passed']:
              raise SystemExit('Public health checks failed; see sanitized evidence artifact.')
          PY

      - name: Retain sanitized public health evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cito-public-health-${{ github.run_id }}
          path: cito-public-health.json
          retention-days: 14
          if-no-files-found: error
