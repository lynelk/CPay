name: Apply CPay P0 financial integrity repairs

on:
  push:
    branches:
      - fix/p0-financial-integrity-20260826
    paths:
      - .github/workflows/fix-financial-integrity-20260826.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-financial-integrity-20260826
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: InitializrSpringbootProjectFresh/pom.xml
      - name: Apply financial integrity repairs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('InitializrSpringbootProjectFresh')
          charging = root/'src/main/java/net/citotech/cito/billing/baas/BillingBaasChargingService.java'
          admin = root/'src/main/java/net/citotech/cito/billing/baas/BillingBaasAdminService.java'
          invoice = root/'src/main/java/net/citotech/cito/billing/invoicing/BillingInvoiceService.java'
          repo = root/'src/main/java/net/citotech/cito/billing/invoicing/BillingInvoiceRepository.java'
          complete = root/'src/main/java/net/citotech/cito/billing/reconciliation/BillingCompletenessGateService.java'
          ledger = root/'src/main/java/net/citotech/cito/billing/integration/cpay/BillingLedgerAccountTemplateService.java'

          def repl(path, old, new, count=1):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'pattern missing in {path}: {old[:120]!r}')
              text2 = text.replace(old, new, count)
              path.write_text(text2)

          # Charging: concurrent idempotency, stale reservation release, atomic entitlements, original usage period.
          repl(charging,
               'import org.springframework.jdbc.core.namedparam.MapSqlParameterSource;\n',
               'import org.springframework.dao.DuplicateKeyException;\nimport org.springframework.jdbc.core.namedparam.MapSqlParameterSource;\n')
          repl(charging,
               '''        ChargeView replay = findByIdempotency(context.billingTenantId(), idem);\n        if (replay != null) {\n            if (replay.billingAccountId() != account.id()\n                    || replay.authorizedNetAmount().compareTo(net) != 0\n                    || !replay.serviceCode().equals(service)\n                    || replay.usageQuantity().compareTo(quantity) != 0\n                    || !sameNullable(replay.entitlementCode(), blankToNull(entitlementCode))) {\n                throw new PaymentGatewayException(\n                        "Charging idempotency key already exists with different attributes");\n            }\n            return replay;\n        }\n''',
               '''        ChargeView replay = findByIdempotency(context.billingTenantId(), idem);\n        if (replay != null) {\n            validateReplay(replay, account.id(), service, entitlementCode, quantity, net);\n            return replay;\n        }\n''')
          repl(charging,
               '''        ChargingAccount chargingAccount =\n                lockChargingAccount(context.billingTenantId(), chargingAccountId);\n        BigDecimal available =\n''',
               '''        ChargingAccount chargingAccount =\n                lockChargingAccount(context.billingTenantId(), chargingAccountId);\n        sweepExpiredReservations(context, chargingAccountId);\n        chargingAccount = lockChargingAccount(context.billingTenantId(), chargingAccountId);\n        BigDecimal available =\n''')
          old_insert = '''        jdbcTemplate.update(\n                "INSERT INTO billing_charge_reservations "\n                        + "(billing_tenant_id,billing_customer_id,charging_account_id,reservation_reference,"\n                        + "service_code,entitlement_code,usage_quantity,currency,authorized_amount,"\n                        + "authorized_net_amount,authorized_tax_amount,tax_rule_version_id,tax_code,tax_rate,"\n                        + "idempotency_key,expires_at) VALUES (:tenant,:customer,:charging_account,:reservation,"\n                        + ":service,:entitlement,:quantity,:currency,:gross,:net,:tax,:tax_rule,:tax_code,"\n                        + ":tax_rate,:idempotency,:expires_at)",\n                p);\n'''
          new_insert = '''        try {\n            jdbcTemplate.update(\n                    "INSERT INTO billing_charge_reservations "\n                            + "(billing_tenant_id,billing_customer_id,charging_account_id,reservation_reference,"\n                            + "service_code,entitlement_code,usage_quantity,currency,authorized_amount,"\n                            + "authorized_net_amount,authorized_tax_amount,tax_rule_version_id,tax_code,tax_rate,"\n                            + "idempotency_key,expires_at) VALUES (:tenant,:customer,:charging_account,:reservation,"\n                            + ":service,:entitlement,:quantity,:currency,:gross,:net,:tax,:tax_rule,:tax_code,"\n                            + ":tax_rate,:idempotency,:expires_at)",\n                    p);\n        } catch (DuplicateKeyException duplicate) {\n            ChargeView winner = findByIdempotency(context.billingTenantId(), idem);\n            if (winner == null) {\n                throw duplicate;\n            }\n            validateReplay(winner, account.id(), service, entitlementCode, quantity, net);\n            return winner;\n        }\n'''
          repl(charging, old_insert, new_insert)
          repl(charging,
               '''        Split prepaidSplit = splitFunding(reservation, prepaid);\n''',
               '''        consumeEntitlementAtomically(context.billingTenantId(), reservation);\n\n        Split prepaidSplit = splitFunding(reservation, prepaid);\n''')
          repl(charging,
               '''        consumeEntitlement(context.billingTenantId(), reservation);\n        return committedView(context.billingTenantId(), reservation.reservationReference());\n''',
               '''        return committedView(context.billingTenantId(), reservation.reservationReference());\n''')
          repl(charging,
               '''        BigDecimal value =\n                jdbcTemplate.queryForObject(\n                        "SELECT COALESCE(consumed_quantity,0) FROM billing_entitlement_usage "\n                                + "WHERE billing_tenant_id=:tenant AND billing_customer_id=:customer "\n                                + "AND entitlement_code=:entitlement AND period_key=:period",\n''',
               '''        BigDecimal value =\n                jdbcTemplate.queryForObject(\n                        "SELECT COALESCE(SUM(consumed_quantity),0) FROM billing_entitlement_usage "\n                                + "WHERE billing_tenant_id=:tenant AND billing_customer_id=:customer "\n                                + "AND entitlement_code=:entitlement AND period_key=:period",\n''')
          start = charging.read_text().index('    private void consumeEntitlement(long tenantId, ChargeView reservation) {')
          end = charging.read_text().index('    private ChargeView lockReservation', start)
          block = '''    private void consumeEntitlementAtomically(long tenantId, ChargeView reservation) {\n        if (reservation.entitlementCode() == null || reservation.entitlementCode().isBlank()) {\n            return;\n        }\n        List<Map<String, Object>> grants =\n                jdbcTemplate.queryForList(\n                        "SELECT g.id,g.limit_quantity FROM billing_entitlement_grants g "\n                                + "JOIN billing_subscriptions s ON s.id=g.billing_subscription_id "\n                                + "WHERE g.billing_tenant_id=:tenant AND g.billing_customer_id=:customer "\n                                + "AND g.entitlement_code=:entitlement AND g.status='ACTIVE' "\n                                + "AND g.valid_from<=CURRENT_TIMESTAMP AND (g.valid_to IS NULL OR g.valid_to>CURRENT_TIMESTAMP) "\n                                + "AND s.status='ACTIVE' AND s.service_code=:service LIMIT 1 FOR UPDATE",\n                        new MapSqlParameterSource()\n                                .addValue("tenant", tenantId)\n                                .addValue("customer", reservation.billingCustomerId())\n                                .addValue("entitlement", reservation.entitlementCode())\n                                .addValue("service", reservation.serviceCode()));\n        if (grants.isEmpty()) {\n            throw new PaymentGatewayException("Required BaaS entitlement is not active at commit");\n        }\n        String period = periodKey(reservation.createdAt());\n        MapSqlParameterSource p =\n                new MapSqlParameterSource()\n                        .addValue("tenant", tenantId)\n                        .addValue("customer", reservation.billingCustomerId())\n                        .addValue("entitlement", reservation.entitlementCode())\n                        .addValue("period", period)\n                        .addValue("quantity", reservation.usageQuantity());\n        jdbcTemplate.update(\n                "INSERT IGNORE INTO billing_entitlement_usage "\n                        + "(billing_tenant_id,billing_customer_id,entitlement_code,period_key,consumed_quantity) "\n                        + "VALUES (:tenant,:customer,:entitlement,:period,0)",\n                p);\n        BigDecimal consumed =\n                jdbcTemplate.queryForObject(\n                        "SELECT consumed_quantity FROM billing_entitlement_usage "\n                                + "WHERE billing_tenant_id=:tenant AND billing_customer_id=:customer "\n                                + "AND entitlement_code=:entitlement AND period_key=:period FOR UPDATE",\n                        p,\n                        BigDecimal.class);\n        BigDecimal current = consumed == null ? BigDecimal.ZERO : consumed;\n        Object limitValue = grants.get(0).get("limit_quantity");\n        if (limitValue != null\n                && current.add(reservation.usageQuantity()).compareTo((BigDecimal) limitValue) > 0) {\n            throw new PaymentGatewayException("BaaS entitlement usage limit would be exceeded");\n        }\n        jdbcTemplate.update(\n                "UPDATE billing_entitlement_usage SET consumed_quantity=consumed_quantity+:quantity "\n                        + "WHERE billing_tenant_id=:tenant AND billing_customer_id=:customer "\n                        + "AND entitlement_code=:entitlement AND period_key=:period",\n                p);\n    }\n\n    private void reverseEntitlementUsage(long tenantId, ChargeView reservation) {\n        if (reservation.entitlementCode() == null || reservation.entitlementCode().isBlank()) {\n            return;\n        }\n        jdbcTemplate.update(\n                "UPDATE billing_entitlement_usage SET consumed_quantity=GREATEST(consumed_quantity-:quantity,0) "\n                        + "WHERE billing_tenant_id=:tenant AND billing_customer_id=:customer "\n                        + "AND entitlement_code=:entitlement AND period_key=:period",\n                new MapSqlParameterSource()\n                        .addValue("tenant", tenantId)\n                        .addValue("customer", reservation.billingCustomerId())\n                        .addValue("entitlement", reservation.entitlementCode())\n                        .addValue("period", periodKey(reservation.createdAt()))\n                        .addValue("quantity", reservation.usageQuantity()));\n    }\n\n'''
          text = charging.read_text(); charging.write_text(text[:start] + block + text[end:])
          repl(charging,
               '''                        + "r.idempotency_key,r.expires_at FROM billing_charge_reservations r "\n''',
               '''                        + "r.idempotency_key,r.expires_at,r.created_at FROM billing_charge_reservations r "\n''')
          repl(charging,
               '''                rs.getString("idempotency_key"),\n                rs.getTimestamp("expires_at").toInstant());\n''',
               '''                rs.getString("idempotency_key"),\n                rs.getTimestamp("expires_at").toInstant(),\n                rs.getTimestamp("created_at").toInstant());\n''')
          repl(charging,
               '''    private String periodKey() {\n        return YearMonth.now(ZoneOffset.UTC).toString();\n    }\n''',
               '''    private String periodKey() {\n        return YearMonth.now(ZoneOffset.UTC).toString();\n    }\n\n    private String periodKey(Instant instant) {\n        return YearMonth.from(instant.atZone(ZoneOffset.UTC)).toString();\n    }\n''')
          repl(charging,
               '''            String idempotencyKey,\n            Instant expiresAt) {}\n''',
               '''            String idempotencyKey,\n            Instant expiresAt,\n            Instant createdAt) {}\n''')
          marker = '    private BillingAccount resolveAccount(\n'
          insert = '''    private void sweepExpiredReservations(BillingBaasContext context, long chargingAccountId) {\n        List<String> expired =\n                jdbcTemplate.query(\n                        "SELECT reservation_reference FROM billing_charge_reservations "\n                                + "WHERE billing_tenant_id=:tenant AND charging_account_id=:account "\n                                + "AND status='AUTHORIZED' AND expires_at<=CURRENT_TIMESTAMP FOR UPDATE",\n                        new MapSqlParameterSource()\n                                .addValue("tenant", context.billingTenantId())\n                                .addValue("account", chargingAccountId),\n                        (rs, rowNum) -> rs.getString(1));\n        for (String reference : expired) {\n            ChargeView reservation = lockReservation(context.billingTenantId(), reference);\n            if ("AUTHORIZED".equals(reservation.status())\n                    && !reservation.expiresAt().isAfter(Instant.now())) {\n                expireAuthorizedReservation(context, reservation);\n            }\n        }\n    }\n\n    private void validateReplay(\n            ChargeView replay,\n            long billingAccountId,\n            String service,\n            String entitlementCode,\n            BigDecimal quantity,\n            BigDecimal net) {\n        if (replay.billingAccountId() != billingAccountId\n                || replay.authorizedNetAmount().compareTo(net) != 0\n                || !replay.serviceCode().equals(service)\n                || replay.usageQuantity().compareTo(quantity) != 0\n                || !sameNullable(replay.entitlementCode(), blankToNull(entitlementCode))) {\n            throw new PaymentGatewayException(\n                    "Charging idempotency key already exists with different attributes");\n        }\n    }\n\n'''
          text = charging.read_text(); idx=text.index(marker); charging.write_text(text[:idx]+insert+text[idx:])

          # Shared funding claim service and migration: one settled PAYIN can only fund its face value globally.
          funding = root/'src/main/java/net/citotech/cito/billing/integration/cpay/BillingPaymentFundingService.java'
          funding.write_text('''package net.citotech.cito.billing.integration.cpay;\n\nimport java.math.BigDecimal;\nimport java.util.List;\nimport java.util.Map;\nimport net.citotech.cito.Model.Transaction;\nimport net.citotech.cito.Model.TransactionStatus;\nimport net.citotech.cito.gateway.PaymentGatewayException;\nimport org.springframework.jdbc.core.namedparam.MapSqlParameterSource;\nimport org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\n@Service\npublic class BillingPaymentFundingService {\n    private final NamedParameterJdbcTemplate jdbcTemplate;\n\n    public BillingPaymentFundingService(NamedParameterJdbcTemplate jdbcTemplate) {\n        this.jdbcTemplate = jdbcTemplate;\n    }\n\n    @Transactional\n    public FundingClaim claim(\n            long billingTenantId,\n            String suppliedReference,\n            String expectedCurrency,\n            BigDecimal amount,\n            boolean exactAmount,\n            String purpose,\n            String targetReference) {\n        if (suppliedReference == null || suppliedReference.isBlank() || amount == null || amount.signum() <= 0) {\n            throw new PaymentGatewayException("A positive amount and settled CPay payment reference are required");\n        }\n        List<PaymentProof> proofs = jdbcTemplate.query(\n                "SELECT t.id,t.merchant_id,t.tx_unique_id,t.status,t.tx_type,t.original_amount,t.currency "\n                        + "FROM merchant_transactions_log t JOIN billing_tenants bt ON bt.merchant_id=t.merchant_id "\n                        + "WHERE bt.id=:tenant AND (t.tx_unique_id=:reference OR t.tx_merchant_ref=:reference "\n                        + "OR t.tx_gateway_ref=:reference) ORDER BY t.id DESC LIMIT 2 FOR UPDATE",\n                new MapSqlParameterSource().addValue("tenant", billingTenantId).addValue("reference", suppliedReference.trim()),\n                (rs, rowNum) -> new PaymentProof(\n                        rs.getLong("id"), rs.getLong("merchant_id"), rs.getString("tx_unique_id"),\n                        rs.getString("status"), rs.getString("tx_type"), rs.getBigDecimal("original_amount"),\n                        rs.getString("currency")));\n        if (proofs.size() != 1) {\n            throw new PaymentGatewayException("Payment reference must resolve to exactly one CPay transaction for this tenant");\n        }\n        PaymentProof proof = proofs.get(0);\n        if (TransactionStatus.fromString(proof.status()) != TransactionStatus.SUCCESSFUL) {\n            throw new PaymentGatewayException("Funding requires a SUCCESSFUL CPay payment");\n        }\n        if (!Transaction.TX_TYPE_PAYIN.equals(proof.transactionType())) {\n            throw new PaymentGatewayException("Funding requires a CPay PAYIN transaction");\n        }\n        String currency = expectedCurrency == null ? "" : expectedCurrency.trim().toUpperCase();\n        if (proof.currency() == null || !proof.currency().equalsIgnoreCase(currency)) {\n            throw new PaymentGatewayException("Funding payment currency does not match the billing account currency");\n        }\n        if (proof.amount() == null || (exactAmount && proof.amount().compareTo(amount) != 0)) {\n            throw new PaymentGatewayException("Funding amount does not match the settled CPay payment amount");\n        }\n        String allocationKey = purpose + ":" + targetReference + ":" + proof.transactionId();\n        List<Map<String,Object>> existing = jdbcTemplate.queryForList(\n                "SELECT source_transaction_id,amount,currency FROM billing_payment_funding_allocations "\n                        + "WHERE billing_tenant_id=:tenant AND allocation_key=:allocation FOR UPDATE",\n                new MapSqlParameterSource().addValue("tenant", billingTenantId).addValue("allocation", allocationKey));\n        if (!existing.isEmpty()) {\n            Map<String,Object> row = existing.get(0);\n            BigDecimal existingAmount = (BigDecimal) row.get("amount");\n            if (((Number) row.get("source_transaction_id")).longValue() != proof.transactionId()\n                    || existingAmount.compareTo(amount) != 0\n                    || !String.valueOf(row.get("currency")).equalsIgnoreCase(currency)) {\n                throw new PaymentGatewayException("Funding allocation idempotency conflict");\n            }\n            return new FundingClaim(proof.transactionId(), proof.merchantId(), proof.canonicalReference(), currency, proof.amount(), true);\n        }\n        BigDecimal allocated = jdbcTemplate.queryForObject(\n                "SELECT COALESCE(SUM(amount),0) FROM billing_payment_funding_allocations "\n                        + "WHERE billing_tenant_id=:tenant AND source_transaction_id=:source",\n                new MapSqlParameterSource().addValue("tenant", billingTenantId).addValue("source", proof.transactionId()),\n                BigDecimal.class);\n        BigDecimal used = allocated == null ? BigDecimal.ZERO : allocated;\n        if (used.add(amount).compareTo(proof.amount()) > 0) {\n            throw new PaymentGatewayException("CPay payment has insufficient unallocated funding balance");\n        }\n        jdbcTemplate.update(\n                "INSERT INTO billing_payment_funding_allocations "\n                        + "(billing_tenant_id,source_transaction_id,allocation_key,purpose,target_reference,amount,currency) "\n                        + "VALUES (:tenant,:source,:allocation,:purpose,:target,:amount,:currency)",\n                new MapSqlParameterSource().addValue("tenant", billingTenantId).addValue("source", proof.transactionId())\n                        .addValue("allocation", allocationKey).addValue("purpose", purpose).addValue("target", targetReference)\n                        .addValue("amount", amount).addValue("currency", currency));\n        return new FundingClaim(proof.transactionId(), proof.merchantId(), proof.canonicalReference(), currency, proof.amount(), false);\n    }\n\n    private record PaymentProof(long transactionId, long merchantId, String canonicalReference, String status, String transactionType, BigDecimal amount, String currency) {}\n\n    public record FundingClaim(long sourceTransactionId, long merchantId, String sourceTransactionReference, String currency, BigDecimal settledAmount, boolean alreadyClaimed) {}\n}\n''')
          migration = root/'src/main/resources/db/migration/V103__billing_financial_integrity.sql'
          migration.write_text('''-- P0 financial-integrity enforcement for verified CPay funding consumption.\nCREATE TABLE IF NOT EXISTS `billing_payment_funding_allocations` (\n  `id` BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,\n  `billing_tenant_id` BIGINT UNSIGNED NOT NULL,\n  `source_transaction_id` BIGINT NOT NULL,\n  `allocation_key` VARCHAR(220) NOT NULL,\n  `purpose` VARCHAR(40) NOT NULL,\n  `target_reference` VARCHAR(160) NOT NULL,\n  `amount` DECIMAL(19,4) NOT NULL,\n  `currency` VARCHAR(10) NOT NULL,\n  `created_at` TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY (`id`),\n  UNIQUE KEY `uk_billing_funding_allocation_key` (`billing_tenant_id`,`allocation_key`),\n  KEY `idx_billing_funding_source` (`billing_tenant_id`,`source_transaction_id`),\n  CONSTRAINT `chk_billing_funding_amount` CHECK (`amount` > 0)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;\n''')

          # Ledger: reclassify the original PAYIN merchant payable rather than inventing cash.
          marker = '    @Transactional\n    public long postPrepaidConsumption(\n'
          methods = '''    @Transactional\n    public long postPrepaidTopUpFromMerchantCollection(\n            long billingTenantId,\n            long merchantId,\n            String currency,\n            BigDecimal amount,\n            String paymentReference,\n            String memo) {\n        List<LedgerEntryCommand> entries =\n                List.of(\n                        merchantEntry(\n                                merchantCollectionsPayableAccount(merchantId, currency),\n                                "Merchant collection payable",\n                                merchantId,\n                                "DR",\n                                amount,\n                                currency,\n                                memo),\n                        entry(\n                                storedValueLiabilityAccount(billingTenantId, currency),\n                                "Billing stored-value liability",\n                                "STORED_VALUE_LIABILITY",\n                                billingTenantId,\n                                "CR",\n                                amount,\n                                currency,\n                                memo));\n        return postAndLink(\n                "billing-topup-reclass:" + paymentReference,\n                "BILLING_TOPUP", paymentReference, memo, entries, billingTenantId,\n                BillingLedgerLinkType.PAYMENT, paymentReference);\n    }\n\n    @Transactional\n    public long postInvoicePaymentFromMerchantCollection(\n            long billingTenantId,\n            long merchantId,\n            String currency,\n            BigDecimal amount,\n            String invoiceReference,\n            String memo) {\n        List<LedgerEntryCommand> entries =\n                List.of(\n                        merchantEntry(\n                                merchantCollectionsPayableAccount(merchantId, currency),\n                                "Merchant collection payable",\n                                merchantId,\n                                "DR", amount, currency, memo),\n                        entry(\n                                arAccount(billingTenantId, currency),\n                                "Billing accounts receivable",\n                                "RECEIVABLE", billingTenantId, "CR", amount, currency, memo));\n        return postAndLink(\n                "billing-invoice-payment-reclass:" + invoiceReference,\n                "BILLING_INVOICE", invoiceReference, memo, entries, billingTenantId,\n                BillingLedgerLinkType.INVOICE, invoiceReference);\n    }\n\n'''
          text=ledger.read_text(); idx=text.index(marker); ledger.write_text(text[:idx]+methods+text[idx:])
          marker = '    private String arAccount(long billingTenantId, String currency) {\n'
          helpers = '''    private LedgerEntryCommand merchantEntry(\n            String accountCode,\n            String accountName,\n            long merchantId,\n            String direction,\n            BigDecimal amount,\n            String currency,\n            String memo) {\n        return new LedgerEntryCommand(\n                accountCode, accountName, "MERCHANT_LIABILITY", "MERCHANT", merchantId,\n                direction, amount, currency, memo);\n    }\n\n    private String merchantCollectionsPayableAccount(long merchantId, String currency) {\n        return "merchant:" + merchantId + ":" + currency + ":collections_payable";\n    }\n\n'''
          text=ledger.read_text(); idx=text.index(marker); ledger.write_text(text[:idx]+helpers+text[idx:])

          # BaaS admin: re-review invalidates active activation; verified funding is currency-safe and reclassified.
          repl(admin,
               'import net.citotech.cito.billing.integration.cpay.BillingLedgerAccountTemplateService;\n',
               'import net.citotech.cito.billing.integration.cpay.BillingLedgerAccountTemplateService;\nimport net.citotech.cito.billing.integration.cpay.BillingPaymentFundingService;\n')
          repl(admin,
               '''    private final BillingLedgerAccountTemplateService ledgerService;\n    private final AdminAuditService auditService;\n''',
               '''    private final BillingLedgerAccountTemplateService ledgerService;\n    private final BillingPaymentFundingService fundingService;\n    private final AdminAuditService auditService;\n''')
          repl(admin,
               '''            BillingLedgerAccountTemplateService ledgerService,\n            AdminAuditService auditService) {\n''',
               '''            BillingLedgerAccountTemplateService ledgerService,\n            BillingPaymentFundingService fundingService,\n            AdminAuditService auditService) {\n''')
          repl(admin,
               '''        this.ledgerService = ledgerService;\n        this.auditService = auditService;\n''',
               '''        this.ledgerService = ledgerService;\n        this.fundingService = fundingService;\n        this.auditService = auditService;\n''')
          repl(admin,
               '''                        + "activation_status=CASE WHEN activation_status='ACTIVE' AND :activation='READY' "\n                        + "THEN 'ACTIVE' ELSE :activation END,approved_by=VALUES(approved_by),"\n                        + "approved_at=VALUES(approved_at),updated_at=CURRENT_TIMESTAMP",\n''',
               '''                        + "activation_status=VALUES(activation_status),approved_by=VALUES(approved_by),"\n                        + "approved_at=VALUES(approved_at),activated_by=NULL,activated_at=NULL,updated_at=CURRENT_TIMESTAMP",\n''')
          start=admin.read_text().index('    @Transactional\n    public Map<String, Object> topUp(')
          end=admin.read_text().index('    public Map<String, Object> tenantProfile', start)
          topup='''    @Transactional\n    public Map<String, Object> topUp(\n            long billingTenantId,\n            String accountReference,\n            BigDecimal amount,\n            String verifiedPaymentReference,\n            String actor) {\n        BigDecimal safeAmount = positive(amount, "amount");\n        BillingAccount account = billingAccount(billingTenantId, accountReference);\n        ensureChargingAccount(billingTenantId, account);\n        BillingPaymentFundingService.FundingClaim claim =\n                fundingService.claim(\n                        billingTenantId, verifiedPaymentReference, account.currency(), safeAmount, true,\n                        "BAAS_TOPUP", String.valueOf(account.id()));\n        if (claim.alreadyClaimed()) {\n            return chargingAccount(billingTenantId, account.id(), account.currency());\n        }\n        String adjustmentKey =\n                "topup:" + billingTenantId + ":" + account.id() + ":" + claim.sourceTransactionId();\n        long ledgerTransactionId =\n                ledgerService.postPrepaidTopUpFromMerchantCollection(\n                        billingTenantId, claim.merchantId(), account.currency(), safeAmount,\n                        claim.sourceTransactionReference(),\n                        "Verified BaaS prepaid top-up " + claim.sourceTransactionReference());\n        MapSqlParameterSource p =\n                new MapSqlParameterSource()\n                        .addValue("tenant", billingTenantId)\n                        .addValue("account", account.id())\n                        .addValue("amount", safeAmount)\n                        .addValue("ledger", ledgerTransactionId)\n                        .addValue("key", adjustmentKey)\n                        .addValue("actor", required(actor, "actor"));\n        jdbcTemplate.update(\n                "UPDATE billing_charging_accounts SET prepaid_balance=prepaid_balance+:amount,"\n                        + "lock_version=lock_version+1 WHERE billing_tenant_id=:tenant AND billing_account_id=:account",\n                p);\n        Long chargingAccountId =\n                jdbcTemplate.queryForObject(\n                        "SELECT id FROM billing_charging_accounts WHERE billing_tenant_id=:tenant "\n                                + "AND billing_account_id=:account", p, Long.class);\n        jdbcTemplate.update(\n                "INSERT INTO billing_charging_adjustments "\n                        + "(billing_tenant_id,charging_account_id,adjustment_type,prepaid_delta,"\n                        + "ledger_transaction_id,idempotency_key,created_by) "\n                        + "VALUES (:tenant,:charging_account,'TOP_UP',:amount,:ledger,:key,:actor)",\n                new MapSqlParameterSource()\n                        .addValue("tenant", billingTenantId)\n                        .addValue("charging_account", chargingAccountId)\n                        .addValue("amount", safeAmount)\n                        .addValue("ledger", ledgerTransactionId)\n                        .addValue("key", adjustmentKey)\n                        .addValue("actor", actor));\n        auditService.record(\n                "BILLING_BAAS", "BAAS_PREPAID_TOPUP", accountReference,\n                "tenant=" + billingTenantId + ",paymentReference=" + claim.sourceTransactionReference());\n        return chargingAccount(billingTenantId, account.id(), account.currency());\n    }\n\n'''
          text=admin.read_text(); admin.write_text(text[:start]+topup+text[end:])
          # Remove obsolete local verifier and PaymentProof record.
          text=admin.read_text()
          if '    private void verifySettledPayIn(' in text:
              s=text.index('    private void verifySettledPayIn('); e=text.index('    private void ensureChargingAccount',s); text=text[:s]+text[e:]
          text=text.replace('    private record PaymentProof(String status, String transactionType, BigDecimal amount) {}\n\n','')
          admin.write_text(text)

          # Invoice repository locking and conditional decrement.
          marker='    public BigDecimal findOutstandingAmount(long billingInvoiceId) {\n'
          method='''    public Optional<BillingInvoiceRecord> findForUpdate(long billingInvoiceId) {\n        List<BillingInvoiceRecord> rows =\n                jdbcTemplate.query(\n                        "SELECT id, billing_tenant_id, invoice_number, currency, period_start, period_end, "\n                                + "status, subtotal_amount, tax_amount, total_amount, finalized_at, "\n                                + "finalized_by, ledger_transaction_id "\n                                + "FROM billing_invoices WHERE id = :id FOR UPDATE",\n                        new MapSqlParameterSource("id", billingInvoiceId),\n                        this::mapInvoice);\n        return rows.isEmpty() ? Optional.empty() : Optional.of(rows.get(0));\n    }\n\n'''
          text=repo.read_text(); idx=text.index(marker); repo.write_text(text[:idx]+method+text[idx:])
          repl(repo,
               '''    public void reduceOutstanding(long billingInvoiceId, BigDecimal amount) {\n        MapSqlParameterSource p = new MapSqlParameterSource();\n        p.addValue("id", billingInvoiceId);\n        p.addValue("amount", amount);\n        jdbcTemplate.update(\n                "UPDATE billing_invoices SET outstanding_amount=GREATEST(outstanding_amount-:amount,0) "\n                        + "WHERE id=:id AND status='FINALIZED'",\n                p);\n    }\n''',
               '''    public int reduceOutstanding(long billingInvoiceId, BigDecimal amount) {\n        MapSqlParameterSource p = new MapSqlParameterSource();\n        p.addValue("id", billingInvoiceId);\n        p.addValue("amount", amount);\n        return jdbcTemplate.update(\n                "UPDATE billing_invoices SET outstanding_amount=outstanding_amount-:amount "\n                        + "WHERE id=:id AND status='FINALIZED' AND outstanding_amount>=:amount",\n                p);\n    }\n''')

          # Invoice service: row serialization + globally claimed settled PAYIN + reclassification ledger.
          repl(invoice,
               'import net.citotech.cito.billing.integration.cpay.BillingLedgerAccountTemplateService;\n',
               'import net.citotech.cito.billing.integration.cpay.BillingLedgerAccountTemplateService;\nimport net.citotech.cito.billing.integration.cpay.BillingPaymentFundingService;\n')
          repl(invoice,
               '''    private final BillingLedgerAccountTemplateService ledgerAccountTemplateService;\n''',
               '''    private final BillingLedgerAccountTemplateService ledgerAccountTemplateService;\n    private final BillingPaymentFundingService fundingService;\n''')
          repl(invoice,
               '''            BillingCompletenessGateService completenessGateService,\n            BillingLedgerAccountTemplateService ledgerAccountTemplateService) {\n''',
               '''            BillingCompletenessGateService completenessGateService,\n            BillingLedgerAccountTemplateService ledgerAccountTemplateService,\n            BillingPaymentFundingService fundingService) {\n''')
          repl(invoice,
               '''        this.ledgerAccountTemplateService = ledgerAccountTemplateService;\n''',
               '''        this.ledgerAccountTemplateService = ledgerAccountTemplateService;\n        this.fundingService = fundingService;\n''')
          start=invoice.read_text().index('    @Transactional\n    public long applyPayment(')
          end=invoice.read_text().index('    @Transactional\n    public long issueCreditNote(', start)
          pay='''    @Transactional\n    public long applyPayment(\n            long billingInvoiceId, String paymentReference, BigDecimal amount, String appliedBy) {\n        requireActor(appliedBy, "Billing payment allocation requires an actor");\n        requirePositive(amount, "Billing payment allocation amount must be positive");\n        if (paymentReference == null || paymentReference.isBlank()) {\n            throw new PaymentGatewayException("Billing payment reference is required");\n        }\n        BillingInvoiceRecord invoice = requireFinalizedInvoiceLocked(billingInvoiceId);\n        BillingPaymentFundingService.FundingClaim claim =\n                fundingService.claim(\n                        invoice.billingTenantId(), paymentReference, invoice.currency(), amount, false,\n                        "INVOICE", String.valueOf(billingInvoiceId));\n        if (claim.alreadyClaimed()) {\n            return 0L;\n        }\n        BigDecimal outstanding = repository.findOutstandingAmount(billingInvoiceId);\n        if (amount.compareTo(outstanding) > 0) {\n            throw new PaymentGatewayException("Billing payment allocation exceeds invoice outstanding amount");\n        }\n        String allocationReference = invoice.invoiceNumber() + ":" + claim.sourceTransactionReference();\n        long txId =\n                ledgerAccountTemplateService.postInvoicePaymentFromMerchantCollection(\n                        invoice.billingTenantId(), claim.merchantId(), invoice.currency(), amount,\n                        allocationReference, "Payment allocated to " + invoice.invoiceNumber());\n        repository.insertPaymentAllocation(\n                invoice.billingTenantId(), billingInvoiceId, claim.sourceTransactionReference(), amount,\n                invoice.currency(), txId);\n        if (repository.reduceOutstanding(billingInvoiceId, amount) != 1) {\n            throw new PaymentGatewayException("Billing invoice outstanding amount changed concurrently");\n        }\n        repository.closeIfSettled(billingInvoiceId, appliedBy.trim());\n        return txId;\n    }\n\n'''
          text=invoice.read_text(); invoice.write_text(text[:start]+pay+text[end:])
          repl(invoice,
               '        BillingInvoiceRecord invoice = requireFinalizedInvoice(billingInvoiceId);\n        BigDecimal outstanding = repository.findOutstandingAmount(billingInvoiceId);\n',
               '        BillingInvoiceRecord invoice = requireFinalizedInvoiceLocked(billingInvoiceId);\n        BigDecimal outstanding = repository.findOutstandingAmount(billingInvoiceId);\n', 1)
          # issueCreditNote has reduceOutstanding call after its ledger post.
          repl(invoice,
               '        repository.reduceOutstanding(billingInvoiceId, grossAmount);\n        repository.closeIfSettled(billingInvoiceId, approvedBy.trim());\n',
               '''        if (repository.reduceOutstanding(billingInvoiceId, grossAmount) != 1) {\n            throw new PaymentGatewayException("Billing invoice outstanding amount changed concurrently");\n        }\n        repository.closeIfSettled(billingInvoiceId, approvedBy.trim());\n''')
          marker='    private BillingInvoiceRecord requireFinalizedInvoice(long billingInvoiceId) {\n'
          method='''    private BillingInvoiceRecord requireFinalizedInvoiceLocked(long billingInvoiceId) {\n        BillingInvoiceRecord invoice =\n                repository.findForUpdate(billingInvoiceId)\n                        .orElseThrow(() -> new PaymentGatewayException("Billing invoice not found: " + billingInvoiceId));\n        if (!"FINALIZED".equals(invoice.status())) {\n            throw new PaymentGatewayException(\n                    "Billing invoice " + billingInvoiceId + " is not FINALIZED (status=" + invoice.status() + ")");\n        }\n        return invoice;\n    }\n\n'''
          text=invoice.read_text(); idx=text.index(marker); invoice.write_text(text[:idx]+method+text[idx:])

          # Completeness gate: re-check unstaged charges and require observed source coverage through period end.
          repl(complete,
               '''                        "SELECT gate_status,waiver_reason,source_watermark_failure_count,material_exception_count "\n''',
               '''                        "SELECT gate_status,waiver_reason,unstaged_charge_count,source_watermark_failure_count,material_exception_count "\n''')
          repl(complete,
               '''        int currentWatermarkFailures = countIncompleteWatermarks(invoice);\n        int currentExceptions = countOpenExceptions(invoice.billingTenantId(), invoice.id(), false);\n        int approvedWatermarkFailures = number(gate.get("source_watermark_failure_count"));\n        int approvedExceptions = number(gate.get("material_exception_count"));\n''',
               '''        int currentUnstaged =\n                invoiceRepository.countUnstagedCustomerCharges(\n                        invoice.billingTenantId(), invoice.currency(), invoice.periodStart(), invoice.periodEnd());\n        int currentWatermarkFailures = countIncompleteWatermarks(invoice);\n        int currentExceptions = countOpenExceptions(invoice.billingTenantId(), invoice.id(), false);\n        int approvedUnstaged = number(gate.get("unstaged_charge_count"));\n        int approvedWatermarkFailures = number(gate.get("source_watermark_failure_count"));\n        int approvedExceptions = number(gate.get("material_exception_count"));\n''')
          repl(complete,
               '''            return currentWatermarkFailures == 0 && currentExceptions == 0;\n        }\n        return currentWatermarkFailures <= approvedWatermarkFailures\n                && currentExceptions <= approvedExceptions;\n''',
               '''            return currentUnstaged == 0 && currentWatermarkFailures == 0 && currentExceptions == 0;\n        }\n        return currentUnstaged <= approvedUnstaged\n                && currentWatermarkFailures <= approvedWatermarkFailures\n                && currentExceptions <= approvedExceptions;\n''')
          repl(complete,
               '''                        "SELECT COUNT(*) FROM billing_source_watermarks "\n                                + "WHERE billing_tenant_id=:tenant AND expected_through_at<=:period_end AND status<>'COMPLETE'",\n''',
               '''                        "SELECT CASE WHEN COUNT(*)=0 THEN 1 ELSE SUM(CASE "\n                                + "WHEN status<>'COMPLETE' OR observed_through_at IS NULL OR observed_through_at<:period_end "\n                                + "THEN 1 ELSE 0 END) END FROM billing_source_watermarks "\n                                + "WHERE billing_tenant_id=:tenant",\n''')

          # Regression contract locks all repaired invariants in place.
          test = root/'src/test/java/net/citotech/cito/billing/baas/BillingFinancialIntegrityRegressionTest.java'
          test.write_text('''package net.citotech.cito.billing.baas;\n\nimport static org.assertj.core.api.Assertions.assertThat;\n\nimport java.nio.charset.StandardCharsets;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport org.junit.jupiter.api.Test;\n\nclass BillingFinancialIntegrityRegressionTest {\n    private String source(String path) throws Exception {\n        return Files.readString(Path.of("src/main/java/net/citotech/cito/" + path), StandardCharsets.UTF_8);\n    }\n\n    @Test\n    void chargingIsConcurrencyAndPeriodSafe() throws Exception {\n        String java = source("billing/baas/BillingBaasChargingService.java");\n        assertThat(java).contains("COALESCE(SUM(consumed_quantity),0)")\n                .contains("consumeEntitlementAtomically")\n                .contains("LIMIT 1 FOR UPDATE")\n                .contains("periodKey(reservation.createdAt())")\n                .contains("sweepExpiredReservations")\n                .contains("DuplicateKeyException");\n    }\n\n    @Test\n    void settledPayinIsGloballyClaimedAndReclassifiedWithoutNewCash() throws Exception {\n        String funding = source("billing/integration/cpay/BillingPaymentFundingService.java");\n        String ledger = source("billing/integration/cpay/BillingLedgerAccountTemplateService.java");\n        String admin = source("billing/baas/BillingBaasAdminService.java");\n        assertThat(funding).contains("LIMIT 2 FOR UPDATE")\n                .contains("SUM(amount)")\n                .contains("billing_payment_funding_allocations")\n                .contains("currency does not match");\n        assertThat(admin).contains("postPrepaidTopUpFromMerchantCollection");\n        assertThat(ledger).contains("collections_payable")\n                .contains("postInvoicePaymentFromMerchantCollection");\n    }\n\n    @Test\n    void invoiceAndCompletenessFinalizationFailClosed() throws Exception {\n        String invoices = source("billing/invoicing/BillingInvoiceRepository.java");\n        String service = source("billing/invoicing/BillingInvoiceService.java");\n        String gate = source("billing/reconciliation/BillingCompletenessGateService.java");\n        assertThat(invoices).contains("FROM billing_invoices WHERE id = :id FOR UPDATE")\n                .contains("outstanding_amount>=:amount");\n        assertThat(service).contains("requireFinalizedInvoiceLocked")\n                .contains("fundingService.claim");\n        assertThat(gate).contains("currentUnstaged")\n                .contains("observed_through_at IS NULL")\n                .contains("observed_through_at<:period_end");\n    }\n}\n''')
          PY
      - name: Format and test backend
        working-directory: InitializrSpringbootProjectFresh
        run: |
          mvn -q spotless:apply
          mvn -q -DskipTests=false test
      - name: Commit verified repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-financial-integrity-20260826.yml
          git add InitializrSpringbootProjectFresh
          git commit -m "fix(billing): enforce P0 financial integrity invariants"
          git push origin HEAD:fix/p0-financial-integrity-20260826
