name: Temporary CPay contract patch

on:
  push:
    branches:
      - hardening/cpay-api-contract-routes
    paths:
      - "scripts/api_docs/patch_cpay_contract_hardening.py"
      - ".github/workflows/temp-cpay-contract-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Patch OpenAPI contract
        run: python scripts/api_docs/patch_cpay_contract_hardening.py

      - name: Commit patched contract
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Docs/Api/cpay-v2-openapi.yaml; then
            echo "OpenAPI contract already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Docs/Api/cpay-v2-openapi.yaml
          git commit -m "docs: align CPay OpenAPI paths with Spring mappings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
