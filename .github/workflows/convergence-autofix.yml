name: Convergence Autofix

on:
  push:
    branches:
      - codex/cito-42-requirements-convergence

permissions:
  contents: write

jobs:
  format-and-refresh-governance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v7
        with:
          ref: codex/cito-42-requirements-convergence
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Refresh finance objective review record
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          governance = Path('ops/iso/governance.json')
          data = json.loads(governance.read_text(encoding='utf-8'))
          objective = next(item for item in data['objectives'] if item['id'] == 'OBJ-FIN-01')
          objective['lastReviewedAt'] = '2026-08-31'
          objective['nextReviewAt'] = '2026-09-01'
          objective['reviewOutcome'] = 'EVIDENCE_PENDING'
          objective['reviewEvidence'] = 'ops/iso/evidence/finance-objective-review-2026-08-31.md'
          governance.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          evidence = Path('ops/iso/evidence/finance-objective-review-2026-08-31.md')
          evidence.write_text(
              '# Finance objective review - 2026-08-31\n\n'
              '- Objective: `OBJ-FIN-01` Daily reconciliation close.\n'
              '- Review outcome: `EVIDENCE_PENDING`.\n'
              '- Release review confirmed financial invariant, tenant-isolation, rating, ledger and revenue-assurance automated gates are passing.\n'
              '- This record does **not** assert that the operational daily reconciliation close has completed. Production reconciliation evidence remains required before the objective can be marked achieved.\n'
              '- Next review: 2026-09-01.\n',
              encoding='utf-8')
          PY

      - name: Apply repository Java formatting
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B spotless:apply --no-transfer-progress

      - name: Commit autofix
        run: |
          if git diff --quiet; then
            echo 'No autofix changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add InitializrSpringbootProjectFresh/src/main/java InitializrSpringbootProjectFresh/src/test/java ops/iso/governance.json ops/iso/evidence/finance-objective-review-2026-08-31.md
          git commit -m 'style: apply Spotless and refresh ISO finance review evidence'
          git push origin HEAD:codex/cito-42-requirements-convergence
