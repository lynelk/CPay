name: Billing P0 Finalize

on:
  push:
    branches:
      - billing-p0-baas-hardening-20260826
    paths:
      - .github/workflows/billing-p0-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: billing-p0-baas-hardening-20260826
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Apply final P0 hardening changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          gov_path = Path('ops/iso/governance.json')
          data = json.loads(gov_path.read_text())
          objective = next(x for x in data['objectives'] if x['id'] == 'OBJ-FIN-01')
          objective['lastReviewedAt'] = '2026-08-26'
          objective['reviewOutcome'] = 'EVIDENCE_PENDING'
          objective['reviewEvidence'] = 'ops/iso/evidence/finance-objective-review-2026-08-26.md'
          objective['nextReviewAt'] = '2026-08-27'
          gov_path.write_text(json.dumps(data, indent=2) + '\n')

          svc_path = Path('InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/billing/baas/BillingBaasChargingService.java')
          svc = svc_path.read_text()
          old = 'WHERE id=:id AND link_status=\'POSTED\''
          new = 'WHERE id=:id AND billing_tenant_id=:tenant AND link_status=\'POSTED\''
          if old not in svc and new not in svc:
              raise SystemExit('Expected ledger-link reversal predicate not found')
          svc = svc.replace(old, new)
          old_params = 'new MapSqlParameterSource("id", link.get("id")));'
          new_params = ('new MapSqlParameterSource()\n'
                        '                                    .addValue("id", link.get("id"))\n'
                        '                                    .addValue("tenant", context.billingTenantId()));')
          if old_params in svc:
              svc = svc.replace(old_params, new_params, 1)
          elif '.addValue("tenant", context.billingTenantId())' not in svc:
              raise SystemExit('Expected ledger-link update parameter binding not found')
          svc_path.write_text(svc)

          test_path = Path('InitializrSpringbootProjectFresh/src/test/java/net/citotech/cito/billing/baas/BillingBaasP0HardeningTest.java')
          test = test_path.read_text()
          if 'allMutableBaasLedgerLinkOperationsRemainTenantScoped' not in test:
              marker = '\n    @Test\n    void migrationPersistsActivationAndProtectedActionConsumptionEvidence()'
              addition = '''\n    @Test\n    void allMutableBaasLedgerLinkOperationsRemainTenantScoped() throws IOException {\n        Path source =\n                Path.of(\n                        "src/main/java/net/citotech/cito/billing/baas/BillingBaasChargingService.java");\n        String java = Files.readString(source, StandardCharsets.UTF_8);\n\n        assertThat(java)\n                .contains(\n                        "WHERE id=:id AND billing_tenant_id=:tenant AND link_status='POSTED'")\n                .contains(\n                        "WHERE billing_tenant_id=:tenant AND reservation_reference=:reservation")\n                .contains(\n                        "WHERE r.billing_tenant_id=:tenant AND r.reservation_reference=:reservation")\n                .contains(\n                        "WHERE billing_tenant_id=:tenant AND idempotency_key=:idempotency");\n    }\n'''
              if marker not in test:
                  raise SystemExit('Test insertion marker not found')
              test = test.replace(marker, addition + marker)
              test = test.replace('import java.nio.file.Path;\n', 'import java.nio.file.Path;\n') if 'import java.nio.file.Path;' in test else test.replace('import java.nio.charset.StandardCharsets;\n', 'import java.nio.charset.StandardCharsets;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\n')
          test_path.write_text(test)
          PY
      - name: Format and verify backend
        working-directory: InitializrSpringbootProjectFresh
        run: |
          mvn -B spotless:apply --no-transfer-progress
          mvn -B verify --no-transfer-progress -Dspring.flyway.enabled=false
      - name: Validate ISO governance metadata
        run: python3 ops/iso/validate_iso_governance.py
      - name: Commit finalization changes
        run: |
          git config user.name "cpay-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ops/iso/governance.json InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/billing/baas/BillingBaasChargingService.java InitializrSpringbootProjectFresh/src/test/java/net/citotech/cito/billing/baas/BillingBaasP0HardeningTest.java
          if git diff --cached --quiet; then
            echo "No finalization changes required"
            exit 0
          fi
          git commit -m "fix(billing): close P0 tenant and governance guards"
          git push origin HEAD:billing-p0-baas-hardening-20260826
