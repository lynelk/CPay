name: OpFin Callback Format Refresh

on:
  push:
    branches:
      - integration/opfin-v5
    paths:
      - .github/workflows/opfin-callback-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InitializrSpringbootProjectFresh
    steps:
      - name: Check out callback integration branch
        uses: actions/checkout@v7
        with:
          ref: integration/opfin-v5
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply Spotless formatting
        run: mvn -B spotless:apply --no-transfer-progress

      - name: Verify callback contract tests and package
        run: mvn -B verify --no-transfer-progress -Dspring.flyway.enabled=false

      - name: Commit formatter output
        working-directory: .
        run: |
          if git diff --quiet -- InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/callback/CallbackTaskService.java InitializrSpringbootProjectFresh/src/test/java/net/citotech/cito/callback/CallbackTaskServiceTest.java; then
            echo "Callback contract is already Spotless-clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/callback/CallbackTaskService.java InitializrSpringbootProjectFresh/src/test/java/net/citotech/cito/callback/CallbackTaskServiceTest.java
          git commit -m "style(callbacks): apply Spotless formatting"
          git push origin HEAD:integration/opfin-v5
