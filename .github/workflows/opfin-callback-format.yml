name: OpFin Callback Contract Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InitializrSpringbootProjectFresh
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Spotless formatting
        run: mvn -B spotless:check --no-transfer-progress

      - name: Verify callback contract and package
        run: mvn -B verify --no-transfer-progress -Dspring.flyway.enabled=false
