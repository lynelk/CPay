name: Cito Public Recovery Check

# Diagnostic branch only. This does not deploy or alter existing release gates.
on:
  push:
    branches: [diagnostic/public-recovery-20260906]
    paths: [.github/workflows/cito-public-recovery-check.yml]

permissions:
  contents: read

jobs:
  public-recovery-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify public liveness and proxied backend readiness
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import socket
          import ssl
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def healthy(status, content_type, body, path):
              if status != 200 or not body.strip() or len(body) > 65536:
                  return False
              if 'html' in content_type.lower() or body.lstrip().startswith(b'<'):
                  return False
              if path == '/healthz':
                  return body.strip() == b'ok'
              try:
                  data = json.loads(body)
              except (ValueError, UnicodeError):
                  return body.strip().lower() in (b'ok', b'up', b'healthy')
              return isinstance(data, dict) and str(data.get('status', '')).upper() in ('UP', 'OK', 'HEALTHY')

          assert healthy(200, 'text/plain', b'ok', '/healthz')
          assert healthy(200, 'application/json', b'{"status":"UP"}', '/readyz')
          assert not healthy(200, 'text/html', b'<html>app</html>', '/readyz')
          assert not healthy(200, 'application/json', b'{"status":"DOWN"}', '/readyz')
          assert not healthy(503, 'application/json', b'{"status":"UP"}', '/readyz')

          opener = urllib.request.build_opener(NoRedirect)
          results = []
          for host in ('cito.coresynergi.es', 'cito-frontend-production.up.railway.app'):
              for path in ('/healthz', '/readyz', '/api/status/health'):
                  result = {'host': host, 'path': path, 'passed': False}
                  for attempt in range(1, 3):
                      started = time.monotonic()
                      result.update(attempt=attempt, http_status=None, error_type=None, reason_type=None)
                      try:
                          req = urllib.request.Request(
                              'https://' + host + path, method='GET',
                              headers={'User-Agent': 'Cito-ReadOnly-Recovery-Check/1.0', 'Accept': '*/*'})
                          with opener.open(req, timeout=10) as response:
                              result['http_status'] = response.status
                              result['passed'] = healthy(response.status, response.headers.get('Content-Type', ''), response.read(65537), path)
                      except urllib.error.HTTPError as exc:
                          result.update(http_status=exc.code, error_type='HTTPError')
                      except urllib.error.URLError as exc:
                          result.update(error_type='URLError', reason_type=type(exc.reason).__name__)
                          if isinstance(exc.reason, socket.gaierror):
                              result['dns_error_code'] = exc.reason.errno
                          if isinstance(exc.reason, ssl.SSLCertVerificationError):
                              result['tls_verify_code'] = exc.reason.verify_code
                      except (TimeoutError, OSError, ValueError) as exc:
                          result['error_type'] = type(exc).__name__
                      result['elapsed_ms'] = round((time.monotonic() - started) * 1000)
                      if result['passed']:
                          break
                      if attempt == 1:
                          time.sleep(2)
                  results.append(result)
                  print(json.dumps(result, sort_keys=True))

          report = {
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
              'workflow_sha': os.environ.get('GITHUB_SHA'),
              'scope': 'GET-only post-recovery public HTTP health. Not runtime SHA attestation, authenticated UAT, provider certification or recovery testing. No credentials, customer data or money movements.',
              'results': results,
              'passed': all(item['passed'] for item in results),
          }
          Path('cito-public-health-after-recovery.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Post-recovery public health\n\n' + report['scope'] + '\n\n')
              summary.write('| Host | Path | HTTP | Passed | Error | Reason |\n|---|---|---|---|---|---|\n')
              for item in results:
                  summary.write(f"| {item['host']} | {item['path']} | {item['http_status']} | {item['passed']} | {item['error_type']} | {item['reason_type']} |\n")
          if not report['passed']:
              raise SystemExit('Post-recovery public health failed; retain the sanitized evidence.')
          PY

      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cito-public-health-after-recovery-${{ github.run_id }}
          path: cito-public-health-after-recovery.json
          retention-days: 14
          if-no-files-found: error
