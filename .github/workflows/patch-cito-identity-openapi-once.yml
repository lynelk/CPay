name: One-time Cito identity OpenAPI patch

on:
  push:
    branches:
      - feature/iso-integrated-management-system

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install OpenAPI validation dependencies
        run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2 openapi-spec-validator==0.7.2
      - name: Patch identity capability contract
        run: python3 scripts/api_docs/patch_cito_identity_capabilities.py
      - name: Validate both API contracts
        run: |
          python3 scripts/api_docs/validate_openapi.py Docs/Api/cpay-v2-openapi.yaml
          python3 scripts/api_docs/validate_openapi.py Docs/Api/cito-platform-v2-openapi.yaml
      - name: Commit contract patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/Api/cito-platform-v2-openapi.yaml
          git commit -m 'docs(api): document identity capability discovery'
          git push origin HEAD:feature/iso-integrated-management-system
