name: Docker Build & Push

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
    paths:
      - "InitializrSpringbootProjectFresh/**"
      - "clientside/**"
      - "compose.yaml"
      - "nginx.conf"
      - "Dockerfile.nginx"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./InitializrSpringbootProjectFresh
          file: ./InitializrSpringbootProjectFresh/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  build-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./clientside
          file: ./clientside/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  build-nginx:
    name: Build & Push Nginx Reverse Proxy Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push nginx image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.nginx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  scan-backend:
    name: Scan Backend Image
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Run Trivy vulnerability scanner
        # Pinned to the maintainer-preserved 0.35.0: earlier trivy-action tags were hit by a
        # supply-chain compromise (CVE-2026-26189, March 2026).
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ needs.build-backend.outputs.image-tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: 'trivy-results.sarif'


      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-backend'

  scan-frontend:
    name: Scan Frontend Image
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ needs.build-frontend.outputs.image-tag }}

          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-frontend'

  scan-nginx:
    name: Scan Nginx Image
    runs-on: ubuntu-latest
    needs: build-nginx
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ needs.build-nginx.outputs.image-tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-nginx'

  container-smoke:
    name: Container Smoke Test
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-nginx]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run the stack with built images
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          compose_file=$(mktemp)
          sed -e "s#context: ./InitializrSpringbootProjectFresh#image: ${REGISTRY}/${IMAGE_NAME}/backend:latest#" \
              -e "s#context: ./Clientside#image: ${REGISTRY}/${IMAGE_NAME}/frontend:latest#" \
              -e "s#image: nginx:latest-alpine#image: ${REGISTRY}/${IMAGE_NAME}/nginx:latest#" \
              compose.yaml > "${compose_file}"
          docker compose -f "${compose_file}" up -d --no-build mysql backend frontend nginx
          docker compose -f "${compose_file}" ps

      - name: Wait for backend health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/actuator/health >/dev/null 2>&1; then
              echo "backend health OK"
              exit 0
            fi
            sleep 5
          done
          echo "backend did not become healthy" >&2
          exit 1

      - name: Verify frontend and reverse proxy
        run: |
          set -euo pipefail
          # Vite preview serves the built SPA at /.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
          echo "frontend status: ${status}"
          test "${status}" = "200"
          health=$(curl -fsS http://127.0.0.1/health)
          echo "nginx proxy health: ${health}"
          test "${health}" = "healthy"
          proxied=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/actuator/health)
          echo "nginx->backend status: ${proxied}"
          test "${proxied}" = "200"

      - name: Tear down the stack
        if: always()
        run: |
          docker compose -f compose.yaml down -v --remove-orphans || true

  create-release:
    name: Create Release Notes
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-nginx]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release notes
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## Container Images Released

          ### Backend
          - Image: ${{ needs.build-backend.outputs.image-tag }}
          - Digest: ${{ needs.build-backend.outputs.image-digest }}

          ### Frontend
          - Image: ${{ needs.build-frontend.outputs.image-tag }}
          - Digest: ${{ needs.build-frontend.outputs.image-digest }}

          ### Nginx Reverse Proxy
          - Image: ${{ needs.build-nginx.outputs.image-tag }}
          - Digest: ${{ needs.build-nginx.outputs.image-digest }}

          Pull and run:
          ```bash
          docker compose -f compose.yaml up --pull always
          ```
          EOF
          cat /tmp/release-notes.md

      - name: Send Slack notification
        if: vars.SLACK_WEBHOOK_URL
        uses: slackapi/slack-github-action@v1
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |

            {
              "text": "✅ CPay Docker images built and pushed successfully",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*CPay Docker Build Complete*\n\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Actor:* ${{ github.actor }}"
                  }
                }
              ]
            }
