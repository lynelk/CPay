name: God-class Java verification

on:
  push:
    branches:
      - refactor/preferred-architecture-alignment

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[god-class-verify]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/preferred-architecture-alignment
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Test, format, verify and record result
        shell: bash
        run: |
          set +e
          cd InitializrSpringbootProjectFresh
          mvn -B test --no-transfer-progress -Dspring.flyway.enabled=false > /tmp/god-class-test.log 2>&1
          test_status=$?
          if [ "$test_status" -eq 0 ]; then
            mvn -B spotless:apply --no-transfer-progress -DskipTests >> /tmp/god-class-test.log 2>&1
            format_status=$?
          else
            format_status=99
          fi
          if [ "$test_status" -eq 0 ] && [ "$format_status" -eq 0 ]; then
            mvn -B verify --no-transfer-progress -Dspring.flyway.enabled=false >> /tmp/god-class-test.log 2>&1
            verify_status=$?
          else
            verify_status=99
          fi
          cd ..
          {
            echo "test_status=$test_status"
            echo "format_status=$format_status"
            echo "verify_status=$verify_status"
            echo "--- tail ---"
            tail -n 240 /tmp/god-class-test.log
          } > Docs/Architecture/.god-class-verify.txt
      - name: Commit verification result and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/ \
                  InitializrSpringbootProjectFresh/src/test/java/net/citotech/cito/ \
                  Docs/Architecture/.god-class-verify.txt
          git commit -m "Verify and format god-class extraction [god-class-verify]" || exit 0
          git push origin HEAD:refactor/preferred-architecture-alignment
