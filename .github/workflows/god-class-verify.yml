name: God-class Java verification

on:
  push:
    branches:
      - refactor/preferred-architecture-alignment

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[god-class-verify]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/preferred-architecture-alignment
          fetch-depth: 0
      - name: Finalize controller money seam
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/TransactionsLogController.java')
          s = p.read_text()
          anchor = '    private net.citotech.cito.transactions.TransactionResolutionService transactionResolutionService;\n'
          field = '\n    @Autowired\n    private net.citotech.cito.payments.legacy.LegacyMoneyMovementService legacyMoneyMovementService;\n'
          if 'LegacyMoneyMovementService legacyMoneyMovementService' not in s:
              if anchor not in s:
                  raise SystemExit('controller service anchor changed')
              s = s.replace(anchor, anchor + field, 1)
          s, payins = re.subn(
              r'Common\.doPayIn\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*,\s*([A-Za-z_][A-Za-z0-9_]*)\s*,\s*jdbcTemplate\s*,\s*transactionManager\s*\)',
              r'legacyMoneyMovementService.collectWithRisk(\1, \2)', s)
          s, payouts = re.subn(
              r'Common\.doPayOut\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*,\s*([A-Za-z_][A-Za-z0-9_]*)\s*,\s*jdbcTemplate\s*,\s*transactionManager\s*\)',
              r'legacyMoneyMovementService.payoutWithRisk(\1, \2)', s)
          p.write_text(s)
          print(f'migrated controller direct money calls: payin={payins}, payout={payouts}')
          PY
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Test, format and record result
        shell: bash
        run: |
          set +e
          cd InitializrSpringbootProjectFresh
          mvn -B test --no-transfer-progress -Dspring.flyway.enabled=false > /tmp/god-class-test.log 2>&1
          test_status=$?
          if [ "$test_status" -eq 0 ]; then
            mvn -B spotless:apply --no-transfer-progress -DskipTests >> /tmp/god-class-test.log 2>&1
            format_status=$?
          else
            format_status=99
          fi
          cd ..
          {
            echo "test_status=$test_status"
            echo "format_status=$format_status"
            echo "--- tail ---"
            tail -n 200 /tmp/god-class-test.log
          } > Docs/Architecture/.god-class-verify.txt
      - name: Commit verification result and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/ \
                  InitializrSpringbootProjectFresh/src/test/java/net/citotech/cito/ \
                  Docs/Architecture/.god-class-verify.txt
          git commit -m "Verify and format god-class extraction [god-class-verify]" || exit 0
          git push origin HEAD:refactor/preferred-architecture-alignment
