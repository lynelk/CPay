name: Temporary invoice cancel OpenAPI patch

on:
  push:
    branches: [ hardening/cpay-api-contract-routes ]
    paths:
      - ".github/workflows/temp-invoice-cancel-openapi-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Align invoice cancel path with Spring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("Docs/Api/cpay-v2-openapi.yaml")
          text = path.read_text(encoding="utf-8")
          old = "  /api/v2/invoices/{reference}/cancel:\n"
          new = "  /api/v2/invoices/{reference}/actions/cancel:\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one old invoice cancel path, found {text.count(old)}")
          if new in text:
              raise SystemExit("canonical invoice cancel path already exists")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Commit OpenAPI correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Docs/Api/cpay-v2-openapi.yaml
          git commit -m "docs: align invoice cancel OpenAPI route"
          git push origin "HEAD:${GITHUB_REF_NAME}"
