name: One-shot shared provider policy repair

on:
  push:
    branches:
      - feature/shared-provider-treasury-completion-20260827

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[policy-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/shared-provider-treasury-completion-20260827
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Add required OpenAPI operation summaries
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Docs/Api/shared-provider-treasury-openapi.yaml')
          text = path.read_text(encoding='utf-8')
          summaries = {
              'listSharedProviderEntitlements': 'List shared-provider merchant entitlements',
              'requestSharedProviderEntitlement': 'Request a shared-provider merchant entitlement',
              'approveSharedProviderEntitlement': 'Approve a shared-provider merchant entitlement',
              'rejectSharedProviderEntitlement': 'Reject a shared-provider merchant entitlement',
              'disableSharedProviderEntitlement': 'Disable a shared-provider merchant entitlement',
              'listPlatformProviderCredentials': 'List masked CPay platform provider credentials',
              'savePlatformProviderCredential': 'Save CPay platform provider credentials',
              'approvePlatformProviderCredential': 'Approve CPay platform provider credentials',
              'disablePlatformProviderCredential': 'Disable CPay platform provider credentials',
              'listProviderTreasuryAccounts': 'List provider treasury accounts',
              'listProviderTreasuryAdjustments': 'List provider treasury adjustments',
              'requestProviderTreasuryAdjustment': 'Request a provider treasury adjustment',
              'approveProviderTreasuryAdjustment': 'Approve and post a provider treasury adjustment',
              'rejectProviderTreasuryAdjustment': 'Reject a provider treasury adjustment',
              'listProviderTreasuryReservations': 'List shared-provider treasury reservations',
              'resolvePendingProviderTreasuryReservation': 'Resolve a pending provider treasury reservation',
              'listMerchantProviderExposures': 'List merchant exposure to CPay provider float',
              'listProviderTreasuryJournal': 'List provider treasury journal entries',
              'listProviderTreasuryReconciliations': 'List provider treasury reconciliations',
              'reconcileProviderTreasuryAccount': 'Reconcile a provider treasury account',
              'setProviderTreasuryLowFloatThreshold': 'Set a provider treasury low-float threshold',
          }
          count = 0
          lines = text.splitlines()
          out = []
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('operationId:'):
                  op = stripped.split(':', 1)[1].strip()
                  if op in summaries:
                      indent = line[:len(line) - len(line.lstrip())]
                      if not (out and out[-1].strip().startswith('summary:')):
                          out.append(f'{indent}summary: {summaries[op]}')
                          count += 1
              out.append(line)
          if count != len(summaries):
              raise SystemExit(f'Expected {len(summaries)} summaries, inserted {count}')
          path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
      - name: Apply repository Java formatting
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B spotless:apply --no-transfer-progress
      - name: Commit policy repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Docs/Api/shared-provider-treasury-openapi.yaml InitializrSpringbootProjectFresh/src/main/java InitializrSpringbootProjectFresh/src/test/java
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -s -m "fix: satisfy shared provider completion gates [policy-repair]"
          git push origin HEAD:feature/shared-provider-treasury-completion-20260827
