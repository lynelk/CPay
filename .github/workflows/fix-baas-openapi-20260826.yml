name: Fix Billing BaaS OpenAPI

on:
  push:
    branches:
      - billing-p0-baas-hardening-20260826
    paths:
      - .github/workflows/fix-baas-openapi-20260826.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: billing-p0-baas-hardening-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Correct OAS 3.0 numeric constraint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Docs/Api/billing-baas-v2-openapi.yaml')
          text = path.read_text()
          old = "amount: { type: number, exclusiveMinimum: 0 }"
          new = "amount: { type: number, minimum: 0, exclusiveMinimum: true }"
          if old not in text:
              raise SystemExit('Expected TopUpRequest amount constraint not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate OpenAPI
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2 openapi-spec-validator==0.7.2
          python scripts/api_docs/validate_openapi.py Docs/Api/billing-baas-v2-openapi.yaml
      - name: Commit correction
        run: |
          git config user.name "cpay-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Docs/Api/billing-baas-v2-openapi.yaml
          git commit -m "fix(api): use OAS 3.0 exclusive minimum syntax"
          git push origin HEAD:billing-p0-baas-hardening-20260826
