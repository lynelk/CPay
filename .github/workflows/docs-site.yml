name: Docs Site

on:
  pull_request:
    branches: [ main ]
    paths:
      - "Docs/**"
      - ".github/workflows/docs-site.yml"
  push:
    branches: [ main ]
    paths:
      - "Docs/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: One-time repair of webhook client on PR head
        if: github.event_name == 'pull_request'
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          git fetch origin 01a966446f20d8bebcf9eaf39d34b4b5ec42076a
          git checkout "${TARGET_BRANCH}"
          git show 01a966446f20d8bebcf9eaf39d34b4b5ec42076a:clientside/src/shared/api/hooks.ts > /tmp/hooks-verified.ts
          cp /tmp/hooks-verified.ts clientside/src/shared/api/hooks.ts
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/hooks-verified.ts').read_text(encoding='utf-8')
          old = '`/api/v2/admin/webhooks/${endpointId}/rotate-secret`'
          new = '`/api/v2/admin/webhooks/endpoints/${endpointId}/rotate-secret`'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one old webhook rotation route, found {source.count(old)}')
          expected = source.replace(old, new, 1)
          Path('/tmp/hooks-expected.ts').write_text(expected, encoding='utf-8')
          Path('clientside/src/shared/api/hooks.ts').write_text(expected, encoding='utf-8')
          PY
          cmp --silent /tmp/hooks-expected.ts clientside/src/shared/api/hooks.ts
          test "$(wc -l < clientside/src/shared/api/hooks.ts)" -gt 1000
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clientside/src/shared/api/hooks.ts
          git commit -m "fix: migrate admin webhook rotation client"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Upload docs verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: cpay-docs-${{ github.sha }}
          path: Docs
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check whether GitHub Pages is configured
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --output /tmp/pages.json --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled for this repository. The docs verification artifact was produced, and Pages deployment was skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            cat /tmp/pages.json
            echo "Unexpected Pages API status: $status" >&2
            exit 1
          fi

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Docs for Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: Docs

      - name: Deploy Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
