# CPay frontend + backend compile validation.
name: CPay CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clientside
    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # Vite 8 requires Node 20.19+ or 22.12+; Node 18 is EOL and unsupported.
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: clientside/package-lock.json
    - run: npm ci --legacy-peer-deps
    - run: npm run build --if-present
      env:
        CI: "false"
        NODE_OPTIONS: "--openssl-legacy-provider"
    - run: npm test -- --passWithNoTests
      env:
        CI: "true"
        NODE_OPTIONS: "--openssl-legacy-provider"

  backend-compile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: InitializrSpringbootProjectFresh/pom.xml
    - name: Compile and package backend
      run: mvn -B -DskipTests package --file InitializrSpringbootProjectFresh/pom.xml
    - name: Run vending tests
      run: mvn -B -Dtest=VendingPricingEngineTest,VendingCallbackSecurityServiceTest test --file InitializrSpringbootProjectFresh/pom.xml
