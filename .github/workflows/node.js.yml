# CPay frontend + backend validation.
name: CPay CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clientside
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: clientside/package-lock.json
    - run: npm ci --legacy-peer-deps
    - run: npm run build --if-present
      env:
        CI: "false"
        NODE_OPTIONS: "--openssl-legacy-provider"
    - run: npm test -- --passWithNoTests
      env:
        CI: "true"
        NODE_OPTIONS: "--openssl-legacy-provider"

  backend-compile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: InitializrSpringbootProjectFresh/pom.xml
    - name: Apply Java formatting
      run: mvn -B spotless:apply --file InitializrSpringbootProjectFresh/pom.xml
    - name: Commit formatter output to this same-repository PR branch
      shell: bash
      run: |
        if ! git diff --quiet -- InitializrSpringbootProjectFresh/src/main/java InitializrSpringbootProjectFresh/src/test/java; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add InitializrSpringbootProjectFresh/src/main/java InitializrSpringbootProjectFresh/src/test/java
          git commit -m "Format vending Java sources"
          git push origin HEAD:${GITHUB_HEAD_REF}
        fi
    - name: Compile, package and check Java formatting
      run: mvn -B -DskipTests verify --file InitializrSpringbootProjectFresh/pom.xml
    - name: Run vending pricing, callback-security and ChargeNow adapter tests
      run: mvn -B -Dtest=VendingPricingEngineTest,VendingCallbackSecurityServiceTest,ChargeNowVendingConnectorAdapterTest test --file InitializrSpringbootProjectFresh/pom.xml
