name: Temporary Spotless apply

on:
  push:
    branches: [ hardening/cpay-api-contract-routes ]
    paths:
      - ".github/workflows/temp-spotless-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply Spotless
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B spotless:apply --no-transfer-progress

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only
          unexpected="$(git diff --name-only | grep -v -E '^InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/(checkout/InvoiceController|compliance/ComplianceReportingController|webhook/MerchantWebhookController)\.java$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected formatter changes:"
            echo "$unexpected"
            exit 1
          fi
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/checkout/InvoiceController.java \
                  InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/compliance/ComplianceReportingController.java \
                  InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/webhook/MerchantWebhookController.java
          git commit -m "style: apply Spotless to route hardening"
          git push origin "HEAD:${GITHUB_REF_NAME}"
