name: Temporary compliance OpenAPI patch

on:
  push:
    branches: [ hardening/cpay-api-contract-routes ]
    paths:
      - ".github/workflows/temp-compliance-openapi-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Add actual compliance report and profile routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("Docs/Api/cpay-v2-openapi.yaml")
          text = path.read_text(encoding="utf-8")
          anchor = """  /api/v2/admin/compliance/cases:\n"""
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one compliance cases anchor, found {text.count(anchor)}")
          if "/api/v2/admin/compliance/report:" in text or "/api/v2/admin/compliance/profiles:" in text:
              raise SystemExit("compliance report/profile routes already present; refusing duplicate insertion")
          block = """  /api/v2/admin/compliance/report:\n    get:\n      summary: Get the compliance reporting view for an optional date range\n      operationId: complianceReport\n      security:\n      - AdminBasicAuth: []\n      parameters:\n      - name: from\n        in: query\n        required: false\n        schema:\n          type: string\n      - name: to\n        in: query\n        required: false\n        schema:\n          type: string\n      responses:\n        '200':\n          description: Compliance report\n  /api/v2/admin/compliance/profiles:\n    get:\n      summary: List compliance profiles\n      operationId: listComplianceProfiles\n      security:\n      - AdminBasicAuth: []\n      parameters:\n      - name: status\n        in: query\n        required: false\n        schema:\n          type: string\n      responses:\n        '200':\n          description: Compliance profiles\n    post:\n      summary: Create or update a compliance profile\n      operationId: upsertComplianceProfile\n      security:\n      - AdminBasicAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n              - entityId\n              properties:\n                entityId:\n                  type: integer\n                  format: int64\n                entityType:\n                  type: string\n                  default: MERCHANT\n                profileType:\n                  type: string\n                  default: KYC\n                tier:\n                  type: string\n                  default: STANDARD\n                status:\n                  type: string\n                  default: PENDING\n                riskRating:\n                  type: string\n                  default: UNKNOWN\n                requiredDocumentsJson:\n                  type: string\n                decisionReason:\n                  type: string\n                verifiedBy:\n                  type: string\n      responses:\n        '200':\n          description: Compliance profile upsert result\n        '400':\n          $ref: '#/components/responses/BadRequest'\n"""
          text = text.replace(anchor, block + anchor, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit OpenAPI correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Docs/Api/cpay-v2-openapi.yaml
          git commit -m "docs: document surviving compliance controller routes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
