name: One-time PR78 financial-message formatting

on:
  push:
    branches:
      - feature/iso-integrated-management-system

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InitializrSpringbootProjectFresh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply repository Java formatter
        run: mvn -B spotless:apply --no-transfer-progress
      - name: Commit only PR78 financial-message formatting
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/financialmessage/BicValidator.java \
            InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/financialmessage/Iso20022XmlValidator.java \
            InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/financialmessage/Iso8583MessageSanitizer.java \
            InitializrSpringbootProjectFresh/src/test/java/net/citotech/cito/financialmessage/FinancialMessagingStandardsTest.java
          if git diff --cached --quiet; then
            echo 'No formatting changes required'
            exit 0
          fi
          git commit -m 'style(iso): format financial messaging boundary code'
          git push origin HEAD:feature/iso-integrated-management-system
