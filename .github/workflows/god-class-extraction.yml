name: God-class extraction rewrite

on:
  push:
    branches:
      - refactor/preferred-architecture-alignment

permissions:
  contents: write

jobs:
  rewrite:
    if: ${{ !contains(github.event.head_commit.message, '[god-class-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/preferred-architecture-alignment
          fetch-depth: 0
      - name: Apply deterministic extraction
        run: |
          python3 scripts/refactor_god_classes.py
          # TransactionQueryService now lives in a subpackage; retain the legacy formatter as a
          # public compatibility delegate surface until its remaining callers migrate.
          sed -i 's/^    static String numberFormat(Double n)/    public static String numberFormat(Double n)/' \
            InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/Common.java
      - name: Commit generated extraction when changed
        run: |
          if git diff --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/
          git commit -m "Apply god-class extraction [god-class-generated]"
          git push origin HEAD:refactor/preferred-architecture-alignment
