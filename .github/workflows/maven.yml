# Build the active CPay Spring Boot backend. The repository root has no pom.xml;
# InitializrSpringbootProjectFresh is the canonical Java 21 application.
name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: InitializrSpringbootProjectFresh/pom.xml
    - name: Build with Maven
      run: mvn -B package --file InitializrSpringbootProjectFresh/pom.xml

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8
      with:
        directory: InitializrSpringbootProjectFresh
