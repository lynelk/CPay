name: Verify CPay integrity patch

on:
  push:
    branches:
      - fix/p0-financial-integrity-20260826
    paths:
      - .github/workflows/retry4-financial-integrity-20260826.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-financial-integrity-20260826
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: InitializrSpringbootProjectFresh/pom.xml
      - name: Apply repair
        run: python3 .github/scripts/apply-financial-integrity-repair-20260826.py
      - name: Verify backend
        working-directory: InitializrSpringbootProjectFresh
        run: |
          mvn -q spotless:apply
          mvn -q -DskipTests=false verify
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-financial-integrity-20260826.yml .github/workflows/retry-financial-integrity-20260826.yml .github/workflows/retry2-financial-integrity-20260826.yml .github/workflows/retry3-financial-integrity-20260826.yml .github/workflows/retry4-financial-integrity-20260826.yml .github/scripts/apply-financial-integrity-repair-20260826.py
          git add InitializrSpringbootProjectFresh
          git commit -m "fix(billing): enforce P0 financial integrity invariants"
          git push origin HEAD:fix/p0-financial-integrity-20260826
