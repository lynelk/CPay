name: Shared Provider Completion Gate

on:
  push:
    branches:
      - feature/shared-provider-treasury-completion-20260827

permissions:
  contents: read
  security-events: write

env:
  DB_URL: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1"
  DB_USERNAME: sa
  DB_PASSWORD: ""
  MAIL_USERNAME: noreply@example.com
  MAIL_PASSWORD: ""
  LOCK_FILE_DIR: /tmp/cpay/locks
  ACTUATOR_USERNAME: ci-actuator
  ACTUATOR_PASSWORD: ci-actuator-password
  ADMIN_API_USERNAME: ci-admin
  ADMIN_API_PASSWORD: ci-admin-password
  CALLBACK_SIGNING_SECRET: ci-callback-secret

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InitializrSpringbootProjectFresh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - run: mvn -B verify --no-transfer-progress -Dspring.flyway.enabled=false

  migration-naming:
    name: Migration naming and duplicates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -euo pipefail
          files=$(find InitializrSpringbootProjectFresh/src/main/resources/db/migration -type f -name 'V*.sql' -printf '%f\n' | sort)
          versions=$(echo "$files" | sed -E 's/^V([0-9]+)__.*/\1/')
          dupes=$(echo "$versions" | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate Flyway versions found: $dupes" >&2
            exit 1
          fi
          test -s InitializrSpringbootProjectFresh/src/main/resources/db/migration/V104__shared_provider_treasury.sql
          test -s InitializrSpringbootProjectFresh/src/main/resources/db/migration/V105__provider_treasury_balanced_journal.sql

  mysql-migration:
    name: Clean MySQL 8.4 migration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cpayadmin
          MYSQL_USER: cpay
          MYSQL_PASSWORD: cpay-ci-password
          MYSQL_ROOT_PASSWORD: root-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: InitializrSpringbootProjectFresh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Enable binary-log-safe trigger creation
        working-directory: .
        run: |
          set -euo pipefail
          MYSQL_CONTAINER=$(docker ps --filter ancestor=mysql:8.4 --format '{{.ID}}' | head -n1)
          test -n "$MYSQL_CONTAINER"
          docker exec "$MYSQL_CONTAINER" mysql -uroot -proot-ci-password -e "SET GLOBAL log_bin_trust_function_creators = 1;"
      - name: Apply every Flyway migration
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/cpayadmin?allowPublicKeyRetrieval=true&useSSL=false
          DB_USERNAME: cpay
          DB_PASSWORD: cpay-ci-password
          ACTUATOR_USERNAME: ci-actuator
          ACTUATOR_PASSWORD: ci-actuator-password
          ADMIN_API_USERNAME: ci-admin
          ADMIN_API_PASSWORD: ci-admin-password
          CALLBACK_SIGNING_SECRET: ci-callback-secret
          MERCHANT_CHANNEL_ENCRYPTION_KEY: Y2ktb25seS1ub3QtYS1wcm9kdWN0aW9uLWtleQ==
          CPAY_KEY_ENCRYPTION_KEY: Y2ktb25seS1ub3QtYS1wcm9kdWN0aW9uLWtleQ==
        run: mvn -B test --no-transfer-progress -Dtest=FlywayMigrationSmokeTest

  frontend:
    name: Frontend lint test typecheck build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clientside
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clientside/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint --if-present
      - run: npm test
        env:
          CI: "true"
          NODE_OPTIONS: "--openssl-legacy-provider"
      - run: npm run typecheck
        env:
          NODE_OPTIONS: "--openssl-legacy-provider"
      - run: npm run build
        env:
          CI: "false"
          NODE_OPTIONS: "--openssl-legacy-provider"

  api-contract:
    name: Shared provider admin contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2 openapi-spec-validator==0.7.2
      - run: python scripts/api_docs/validate_openapi.py Docs/Api/shared-provider-treasury-openapi.yaml
      - run: |
          python scripts/api_docs/changed_controller_contract.py origin/main HEAD \
            Docs/Api/cpay-v2-openapi.yaml Docs/Api/cito-platform-v2-openapi.yaml \
            Docs/Api/billing-baas-v2-openapi.yaml Docs/Api/shared-provider-treasury-openapi.yaml

  owasp:
    name: OWASP dependency check
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: InitializrSpringbootProjectFresh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - run: >-
          mvn -B org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=9 -DnvdDatafeedUrl="https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz" -Dformat=HTML --no-transfer-progress

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: security-extended
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Build for CodeQL
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B compile --no-transfer-progress -DskipTests
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
